<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#15171a" />
<title>Código Fibras · Móvil</title>
<link rel="preconnect" href="" />
<link rel="preconnect" href="" crossorigin />
<link href="vendor/fonts.css" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f5f1;
    --bg-elev: #ffffff;
    --bg-soft: #ecebe5;
    --ink: #15171a;
    --ink-2: #4a4f57;
    --ink-3: #8b9099;
    --line: #d9d8d2;
    --line-strong: #b9b7ad;
    --accent: #0f5132;
    --warn: #c44d20;
    --danger: #b3261e;
    --tab-h: 64px;
    --header-h: 56px;
    --shadow-md: 0 4px 14px rgba(15,17,20,.08);
    --shadow-lg: 0 -10px 40px rgba(0,0,0,.25);
    --radius: 14px;
    --radius-sm: 10px;
    --tap: 44px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #0c0e11;
    --bg-elev: #161a1f;
    --bg-soft: #1c2128;
    --ink: #f0eee6;
    --ink-2: #b0b6bf;
    --ink-3: #6a7280;
    --line: #262b32;
    --line-strong: #3a414a;
    --accent: #4ade80;
    --warn: #f59e0b;
    --danger: #f87171;
    --shadow-md: 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg: 0 -10px 40px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    overscroll-behavior-y: none;
  }
  body {
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
  }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; font-size: 16px; /* iOS no zoom */ }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }

  /* ---------- App shell ---------- */
  .app {
    min-height: 100dvh;
    display: flex; flex-direction: column;
    padding-bottom: calc(var(--tab-h) + var(--safe-bot));
  }

  /* ---------- Top header ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: var(--safe-top) 12px 0;
    display: flex; align-items: center; gap: 8px;
    height: calc(var(--header-h) + var(--safe-top));
  }
  .topbar h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.01em;
    margin: 0;
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .topbar h1 .sub {
    display: block;
    font-size: 11px;
    color: var(--ink-3);
    font-weight: 500;
    margin-top: 0;
    overflow: hidden; text-overflow: ellipsis;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .iconbtn {
    width: var(--tap); height: var(--tap);
    min-width: var(--tap);
    border-radius: 12px;
    background: transparent;
    border: none;
    display: grid; place-items: center;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s ease;
  }
  .iconbtn:active { background: var(--bg-soft); }
  .iconbtn.danger { color: var(--danger); }

  /* ---------- Bottom tab bar ---------- */
  .tabbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(var(--tab-h) + var(--safe-bot));
    padding-bottom: var(--safe-bot);
    background: var(--bg-elev);
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 40;
  }
  .tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-3);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .04em;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px;
    cursor: pointer;
    padding: 6px 4px 8px;
    position: relative;
    transition: color .12s ease;
  }
  .tab .ico { display: grid; place-items: center; }
  .tab.active { color: var(--ink); }
  .tab.active::before {
    content: '';
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px; height: 3px;
    border-radius: 0 0 3px 3px;
    background: var(--ink);
  }
  .tab .badge {
    position: absolute;
    top: 8px;
    right: calc(50% - 22px);
    background: var(--danger);
    color: white;
    min-width: 16px; height: 16px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    display: grid; place-items: center;
    padding: 0 4px;
    font-family: 'Geist Mono', monospace;
  }

  /* ---------- Search row ---------- */
  .search-row {
    padding: 10px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center;
  }
  .search-input {
    flex: 1;
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg-elev);
    color: var(--ink);
    padding: 0 16px 0 40px;
    font-size: 15px;
    outline: none;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%238b9099' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.3-4.3'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: 12px center;
  }
  .search-input:focus {
    border-color: var(--ink);
    background-color: var(--bg-elev);
  }
  .search-input::placeholder { color: var(--ink-3); }
  .search-row .iconbtn { width: 42px; height: 42px; border-radius: 12px; background: var(--bg-elev); border: 1px solid var(--line); }

  /* ---------- Content scroll area ---------- */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ---------- Operator group ---------- */
  .op-group {
    background: var(--bg);
    margin-bottom: 6px;
  }
  .op-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    color: var(--ink);
    background: var(--bg-soft);
    border-bottom: 1px solid var(--line);
    border-top: 1px solid var(--line);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .1em;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
  }
  .op-head .chev {
    transition: transform .15s ease;
    color: var(--ink-3);
  }
  .op-group.collapsed .chev { transform: rotate(-90deg); }
  .op-group.collapsed .op-cables { display: none; }
  .op-head .count {
    font-family: 'Geist Mono', monospace;
    background: var(--bg-soft);
    padding: 2px 8px;
    border-radius: 999px;
    color: var(--ink-2);
  }
  .op-head .menu-btn {
    margin-left: auto;
    width: 32px; height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-3);
    display: grid; place-items: center;
    cursor: pointer;
  }
  .op-head .menu-btn:active { background: var(--bg-soft); }

  /* ---------- Cable list item ---------- */
  .clitem {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: var(--bg-elev);
    border: none;
    color: var(--ink);
    text-align: left;
    width: 100%;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    transition: background .12s ease;
  }
  .clitem:active { background: var(--bg-soft); }
  .clitem.active {
    background: color-mix(in srgb, var(--ink) 8%, var(--bg-elev));
    border-left: 3px solid var(--ink);
    padding-left: 13px;
  }
  .cli-dots { display: flex; gap: 3px; flex-shrink: 0; }
  .cli-dot {
    width: 12px; height: 12px; border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
  }
  .cli-body { flex: 1; min-width: 0; }
  .cli-name {
    font-weight: 500;
    font-size: 15px;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cli-sub {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 2px;
  }
  .cli-count {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--ink-3);
    padding: 3px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    flex-shrink: 0;
  }
  .clitem.active .cli-count { border-color: var(--ink); color: var(--ink); }

  /* ---------- Cable detail ---------- */
  .canvas {
    padding: 12px;
    display: flex; flex-direction: column; gap: 12px;
  }

  /* Sequence cards */
  .seq-card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
  }
  .seq-card-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .seq-card-head h3 {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-2);
  }
  .seq-card-head .hint {
    font-size: 11px;
    color: var(--ink-3);
    margin-left: auto;
  }
  .seq-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .seq-chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px 6px 6px;
    border-radius: 999px;
    background: var(--bg-soft);
    border: 1px solid transparent;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--ink);
    min-height: 36px;
  }
  .seq-chip:active { background: var(--bg-elev); border-color: var(--line-strong); }
  .seq-chip .sw {
    width: 24px; height: 24px;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.2);
    flex-shrink: 0;
  }
  .seq-chip .idx {
    font-family: 'Geist Mono', monospace;
    color: var(--ink-3);
    font-size: 10px;
    font-weight: 600;
  }

  /* Tube */
  .tube {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .tube-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .tube-head:active { background: var(--bg-soft); }
  .tube-num {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--bg-soft);
    display: grid; place-items: center;
    font-family: 'Geist Mono', monospace;
    font-weight: 600; font-size: 13px;
    flex-shrink: 0;
  }
  .tube-color {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px 4px 4px;
    border-radius: 999px;
    background: var(--bg-soft);
    font-size: 13px;
    font-weight: 600;
  }
  .tube-color .sw {
    width: 22px; height: 22px;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.2);
  }
  .tube-count {
    margin-left: auto;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-3);
  }
  .fibers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 12px;
  }
  @media (min-width: 480px) {
    .fibers { grid-template-columns: repeat(6, 1fr); }
  }
  .fiber {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 6px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer;
    min-height: 76px;
    transition: all .12s ease;
  }
  .fiber:active {
    border-color: var(--line-strong);
    transform: scale(.97);
  }
  .fiber.highlight {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 18%, transparent);
  }
  .fiber-stick {
    width: 16px; height: 44px;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
    position: relative;
  }
  .fiber-stick::after {
    content: '';
    position: absolute;
    left: 2px; top: 2px; bottom: 2px;
    width: 4px;
    background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0));
    border-radius: 4px 0 0 4px;
  }
  .fiber-num {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--ink-3);
    font-weight: 500;
  }
  .fiber.highlight .fiber-num { color: var(--ink); font-weight: 700; }

  /* Lookup result */
  .lookup {
    background: var(--ink);
    color: var(--bg);
    border-radius: var(--radius);
    padding: 14px;
    display: flex; gap: 12px; align-items: center;
  }
  .lookup-num {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.25);
    display: grid; place-items: center;
    font-size: 20px;
    font-weight: 700;
    font-family: 'Geist Mono', monospace;
    flex-shrink: 0;
  }
  .lookup-body { flex: 1; min-width: 0; }
  .lookup-row {
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap;
    font-size: 13px;
  }
  .lookup-row + .lookup-row { margin-top: 4px; opacity: .8; font-size: 11px; }
  .lookup-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px 3px 3px;
    border-radius: 999px;
    background: rgba(255,255,255,.18);
    font-weight: 600;
  }
  .lookup-pill .sw {
    width: 18px; height: 18px; border-radius: 50%;
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.2);
  }
  .lookup-x {
    width: 32px; height: 32px;
    border-radius: 999px;
    background: rgba(255,255,255,.1);
    border: none;
    color: var(--bg);
    display: grid; place-items: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Cable header (sticky-ish summary) */
  .ch-head {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .ch-head h2 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .ch-head .stats {
    color: var(--ink-3);
    font-size: 12px;
    font-family: 'Geist Mono', monospace;
  }
  .ch-head .stats b { color: var(--ink); }

  /* Info tab */
  .info-pad { padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .info-pad h2 {
    margin: 4px 0 6px;
    font-size: 16px;
    font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .info-pad h2 .count {
    font-size: 12px;
    font-family: 'Geist Mono', monospace;
    color: var(--ink-3);
    font-weight: 500;
  }
  .notes {
    width: 100%;
    min-height: 160px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-elev);
    color: var(--ink);
    padding: 14px;
    font-size: 14px;
    line-height: 1.6;
    font-family: inherit;
    resize: vertical;
    outline: none;
  }
  .notes:focus { border-color: var(--ink); }

  .upload-opts {
    background: var(--bg-soft);
    padding: 12px;
    border-radius: 12px;
    display: flex; flex-direction: column; gap: 10px;
    font-size: 13px;
  }
  .opt-row { display: flex; align-items: center; gap: 10px; }
  .opt-row label {
    flex: 0 0 90px;
    font-size: 12px;
    color: var(--ink-2);
    font-weight: 500;
  }
  .opt-row select, .opt-row input[type=range] {
    flex: 1;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    color: var(--ink);
    outline: none;
  }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  @media (min-width: 480px) {
    .photo-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .photo {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 1;
    cursor: pointer;
  }
  .photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo .meta {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(0deg, rgba(0,0,0,.7), transparent);
    color: white;
    font-size: 10px;
    padding: 16px 8px 6px;
    font-family: 'Geist Mono', monospace;
  }
  .photo-add {
    background: transparent;
    border: 2px dashed var(--line-strong);
    border-radius: 12px;
    aspect-ratio: 1;
    color: var(--ink-3);
    cursor: pointer;
    display: grid; place-items: center;
    font-size: 12px;
    text-align: center;
    padding: 14px;
  }
  .photo-add:active { background: var(--bg-soft); border-color: var(--ink); color: var(--ink); }

  .lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 90;
    display: grid; place-items: center;
    padding: 12px;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .lightbox .lb-close {
    position: absolute;
    top: calc(var(--safe-top) + 12px);
    right: 12px;
    width: 44px; height: 44px;
    border-radius: 999px;
    background: rgba(255,255,255,.15);
    border: none; color: white;
    display: grid; place-items: center;
  }
  .lightbox .lb-cap {
    position: absolute;
    bottom: calc(var(--safe-bot) + 16px);
    left: 12px; right: 12px;
    text-align: center;
    color: white;
    font-size: 13px;
  }

  /* "Más" / settings */
  .settings { padding: 8px 0 24px; }
  .settings .grp {
    margin: 14px 0 6px;
    padding: 0 16px;
    color: var(--ink-3);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .1em;
    font-weight: 700;
  }
  .settings .row {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 14px 16px;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--line);
    border-top: none;
    border-left: none; border-right: none;
    color: var(--ink);
    cursor: pointer;
    font-size: 15px;
    text-align: left;
  }
  .settings .row:active { background: var(--bg-soft); }
  .settings .row .ico { color: var(--ink-2); flex-shrink: 0; width: 22px; display: grid; place-items: center; }
  .settings .row .label { flex: 1; }
  .settings .row .sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .settings .row .chevr { color: var(--ink-3); }
  .settings .row.danger { color: var(--danger); }
  .settings .row.danger .ico { color: var(--danger); }

  /* Empty state */
  .empty {
    padding: 80px 24px;
    text-align: center;
    color: var(--ink-3);
  }
  .empty h2 { color: var(--ink); margin: 0 0 8px; font-weight: 600; }

  /* ---------- Bottom sheet ---------- */
  .sheet-back {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 70;
    animation: fade .18s ease;
    display: flex; align-items: flex-end;
    justify-content: center;
  }
  @keyframes fade { from { opacity: 0; } }
  .sheet {
    width: 100%;
    max-width: 600px;
    background: var(--bg-elev);
    border-radius: 22px 22px 0 0;
    max-height: 92dvh;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-lg);
    animation: slideup .22s cubic-bezier(.2,.7,.2,1);
    padding-bottom: var(--safe-bot);
  }
  @keyframes slideup { from { transform: translateY(20px); opacity: 0; } }
  .sheet .grab {
    width: 40px; height: 4px;
    background: var(--line-strong);
    border-radius: 4px;
    margin: 10px auto 4px;
    flex-shrink: 0;
  }
  .sheet-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .sheet-head h3 {
    margin: 0; flex: 1;
    font-size: 16px;
    font-weight: 600;
  }
  .sheet-body {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .sheet-foot {
    display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: var(--bg-elev);
    flex-shrink: 0;
  }
  .sheet-foot .btn { flex: 1; }

  /* Form fields (in sheets) */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-3);
    font-weight: 700;
  }
  .input, .select, textarea.input {
    appearance: none;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--bg);
    padding: 12px 14px;
    font-size: 16px;
    outline: none;
    transition: border .12s ease;
    color: var(--ink);
    width: 100%;
  }
  textarea.input { resize: vertical; min-height: 80px; font-family: inherit; line-height: 1.5; }
  .input:focus, .select:focus, textarea.input:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 15%, transparent);
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Buttons */
  .btn {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: var(--bg-elev);
    color: var(--ink);
    padding: 13px 16px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    min-height: 48px;
  }
  .btn:active { background: var(--bg-soft); transform: scale(.98); }
  .btn-primary {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn-danger { color: var(--danger); border-color: var(--line); }

  /* FAB */
  .fab {
    position: fixed;
    right: 16px;
    bottom: calc(var(--tab-h) + var(--safe-bot) + 16px);
    width: 56px; height: 56px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    border: none;
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    z-index: 35;
  }
  .fab:active { transform: scale(.95); }

  /* Color picker (in sheet) */
  .pal-preview {
    width: 56px; height: 56px;
    border-radius: 14px;
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.18);
    flex-shrink: 0;
  }
  .color-name-input {
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    background: var(--bg);
    outline: none;
    color: var(--ink);
  }
  .color-name-input:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 14%, transparent);
  }
  .color-name-input.invalid {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 14%, transparent);
  }
  .pat-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--bg-soft);
    padding: 4px;
    border-radius: 12px;
  }
  .pat-tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-2);
    padding: 10px 4px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 40px;
  }
  .pat-tab.active {
    background: var(--bg-elev);
    color: var(--ink);
    box-shadow: var(--shadow-md);
  }
  .pat-preview {
    width: 18px; height: 18px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.2);
  }

  .color-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .color-cell {
    appearance: none;
    aspect-ratio: 1;
    border-radius: 12px;
    cursor: pointer;
    border: 3px solid transparent;
    position: relative;
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.2);
    padding: 0;
  }
  .color-cell.selected {
    border-color: var(--ink);
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.2), 0 0 0 2px var(--bg-elev);
  }
  .pal-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-3);
    font-weight: 700;
    margin: 6px 0 0;
  }

  /* Action menu (popover) */
  .menu {
    position: fixed;
    z-index: 60;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 6px;
    box-shadow: 0 14px 32px rgba(0,0,0,.25);
    min-width: 220px;
  }
  .menu button {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 12px 14px;
    border-radius: 10px;
    color: var(--ink);
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    display: flex; align-items: center; gap: 12px;
  }
  .menu button:active { background: var(--bg-soft); }
  .menu button.danger { color: var(--danger); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }

  /* Welcome */
  .welcome-body { font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
  .welcome-body b { color: var(--ink); }
  .welcome-body code {
    background: var(--bg-soft);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: var(--ink);
    word-break: break-all;
  }
  .welcome-warn {
    background: color-mix(in srgb, var(--warn) 12%, var(--bg-elev));
    border-left: 3px solid var(--warn);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin: 12px 0;
  }
  .welcome-body ul { padding-left: 20px; margin: 10px 0; }
  .welcome-body li { margin: 6px 0; }
  .dontshow {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    user-select: none;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: calc(var(--tab-h) + var(--safe-bot) + 12px);
    left: 50%; transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
    max-width: 88%;
    text-align: center;
    animation: toastup .25s ease;
  }
  @keyframes toastup { from { transform: translate(-50%, 10px); opacity: 0; } }

  /* Lock indicator */
  .aruiz-badge {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 11px; font-weight: 700;
    letter-spacing: .04em;
    background: rgba(56, 134, 255, .18);
    color: #2563eb;
    border: 1px solid rgba(56, 134, 255, .35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    white-space: nowrap;
    margin-right: 4px;
  }
  html[data-theme="dark"] .aruiz-badge {
    background: rgba(96, 165, 250, .18);
    color: #93c5fd;
    border-color: rgba(96, 165, 250, .35);
  }
  .lock-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--bg-soft);
    color: var(--ink-2);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .lock-pill.unlocked {
    background: color-mix(in srgb, var(--accent) 22%, var(--bg-elev));
    color: var(--accent);
  }
  html[data-theme="dark"] .lock-pill.unlocked {
    background: color-mix(in srgb, var(--accent) 28%, transparent);
    color: var(--accent);
  }

  /* Reference table */
  .ref-section {
    padding: 12px;
    display: flex; flex-direction: column; gap: 14px;
    padding-bottom: 80px;
  }
  .ref-card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .ref-card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev);
  }
  .ref-card-head h3 {
    margin: 0; flex: 1;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-2);
  }
  .ref-card-head .add-btn {
    background: var(--bg-soft);
    border: none;
    color: var(--ink);
    width: 30px; height: 30px;
    border-radius: 8px;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .ref-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .ref-table th, .ref-table td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
  }
  .ref-table th {
    background: var(--bg-soft);
    font-size: 11px;
    color: var(--ink-2);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .ref-table tr:last-child td { border-bottom: none; }
  .ref-table .row-action {
    width: 36px;
    text-align: right;
  }
  .ref-table .row-action button {
    background: transparent;
    border: none;
    color: var(--ink-3);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
  }
  .ref-table .row-action button:active { background: var(--bg-soft); }
  .ref-table .editable {
    cursor: text;
    border-radius: 4px;
  }
  .ref-table .editable:hover { background: var(--bg-soft); }
  .ref-table input[type=text] {
    width: 100%;
    border: none;
    background: transparent;
    color: inherit;
    font: inherit;
    outline: none;
    padding: 0;
  }

  /* Gallery */
  .gal-section { padding: 12px; padding-bottom: calc(var(--tab-h) + var(--safe-bot) + 80px); }
  .gal-toolbar {
    display: flex; gap: 8px; align-items: center; margin-bottom: 12px;
  }
  .gal-search {
    flex: 1;
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg-elev);
    color: var(--ink);
    padding: 0 14px;
    font-size: 15px;
    outline: none;
  }
  .gal-cats {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .gal-cat {
    background: var(--bg-soft);
    border: 1px solid transparent;
    color: var(--ink-2);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .gal-cat.active {
    background: var(--ink);
    color: var(--bg);
  }
  .gal-cat .n {
    margin-left: 5px;
    color: var(--ink-3);
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
  }
  .gal-cat.active .n { color: var(--bg); opacity: .65; }

  .gal-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  @media (min-width: 480px) {
    .gal-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .gal-item {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
  }
  .gal-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--bg-soft);
  }
  .gal-item .gal-cap {
    padding: 8px 10px;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.3;
    border-top: 1px solid var(--line);
  }
  .gal-item .gal-meta {
    font-size: 10px;
    color: var(--ink-3);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .gal-item .gal-del {
    position: absolute;
    top: 6px; right: 6px;
    width: 30px; height: 30px;
    border-radius: 999px;
    background: rgba(0,0,0,.6);
    color: white;
    border: none;
    display: grid; place-items: center;
    cursor: pointer;
  }

  .gal-add {
    aspect-ratio: 1;
    border: 2px dashed var(--line-strong);
    border-radius: 12px;
    display: grid; place-items: center;
    color: var(--ink-3);
    background: transparent;
    cursor: pointer;
    text-align: center;
    padding: 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .gal-add:active { background: var(--bg-soft); color: var(--ink); }

  /* Scrollbar (mostly hidden on mobile) */
  ::-webkit-scrollbar { width: 0; height: 0; }

  .signature { display: none; }

  /* Animations */
  .theme-toggle { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
  .theme-toggle:active { transform: rotate(180deg) scale(.94); }
  .lock-pill { transition: background .15s ease, color .15s ease, transform .12s ease; }
  .lock-pill:active { transform: scale(.95); }
  .clitem { transition: background .14s ease, border-left .14s ease, padding-left .14s ease; }
  .seq-chip { transition: background .14s ease, transform .08s ease; }
  .seq-chip:active { transform: scale(.96); }
  .tab { transition: color .15s ease; }
  .tab.active::before { transition: width .2s ease; }
  .fab { transition: transform .15s cubic-bezier(.34,1.56,.64,1); }
  .fab:active { transform: scale(.92) rotate(8deg); }
  .iconbtn { transition: background .12s ease, transform .1s ease; }
  .iconbtn:active { transform: scale(.92); }
  /* Theme icon swap animation */
  .theme-icon-swap { display: inline-flex; animation: themeRotate .42s cubic-bezier(.34,1.56,.64,1); }
  @keyframes themeRotate {
    from { transform: rotate(-180deg) scale(.4); opacity: 0; }
    to   { transform: rotate(0deg) scale(1); opacity: 1; }
  }
  .photo, .gal-item { transition: transform .14s ease, box-shadow .14s ease; }
  .photo:active, .gal-item:active { transform: scale(.97); }
  .pat-tab { transition: background .15s ease, color .15s ease; }
</style>
</head>

// CODIGO FIBRAS — shared data, palette, storage helpers
// ============================================================

// Standard fiber/tube color palette. Each entry: { id, name, hex, ring }
// `ring` is a darker border so light colors (Blanco, Amarillo) stay visible.
window.PALETTE = [
  { id: 'rojo',      name: 'Rojo',      hex: '#FF0000', ring: '#a00000' },
  { id: 'azul',      name: 'Azul',      hex: '#1D6FE0', ring: '#0a3d8a' },
  { id: 'verde',     name: 'Verde',     hex: '#1FA959', ring: '#0d6b35' },
  { id: 'amarillo',  name: 'Amarillo',  hex: '#FFD700', ring: '#a07e00' },
  { id: 'violeta',   name: 'Violeta',   hex: '#7C3AED', ring: '#4a1e9c' },
  { id: 'blanco',    name: 'Blanco',    hex: '#F5F5F5', ring: '#9aa0a6' },
  { id: 'naranja',   name: 'Naranja',   hex: '#FF6A00', ring: '#a83a00' },
  { id: 'gris',      name: 'Gris',      hex: '#7a8693', ring: '#3d464f' },
  { id: 'marron',    name: 'Marrón',    hex: '#7A4A1F', ring: '#3f2710' },
  { id: 'negro',     name: 'Negro',     hex: '#1a1d22', ring: '#000000' },
  { id: 'turquesa',  name: 'Turquesa',  hex: '#26C6DA', ring: '#0e7d8b' },
  { id: 'rosa',      name: 'Rosa',      hex: '#FF6FAF', ring: '#a8366f' },
];

window.colorById = (id) => window.PALETTE.find(c => c.id === id) || window.PALETTE[0];

// ---- Color value helpers ----------------------------------------------------
// A color value can be:
//   'rojo'        — sólido
//   'rojo/azul'   — bicolor (mitad rojo, mitad azul)
//   'rojo:1'      — pica simple (rojo + 1 raya negra)
//   'rojo:2'      — 2 picas (2 rayas negras)
//   'rojo:3'      — 3 picas (3 rayas negras)
window.parseColor = function (val) {
  if (!val) return { kind: 'solid', ids: ['blanco'], picas: 0 };
  const s = String(val);
  if (s.includes(':')) {
    const [base, rest] = s.split(':').map(x => x.trim());
    const n = parseInt(rest);
    if (!isNaN(n) && n >= 1 && n <= 3) {
      return { kind: 'pica', ids: [base || 'blanco'], picas: n };
    }
    // Legacy "rojo:azul" → treat as 1 pica on base (ignore old stripe color)
    return { kind: 'pica', ids: [base || 'blanco'], picas: 1 };
  }
  if (s.includes('/')) {
    const parts = s.split('/').map(x => x.trim()).filter(Boolean);
    return { kind: 'bicolor', ids: parts.slice(0, 2), picas: 0 };
  }
  return { kind: 'solid', ids: [s.trim()], picas: 0 };
};
window.formatColor = function (kind, ids, picas = 1) {
  if (kind === 'bicolor') return `${ids[0]}/${ids[1]}`;
  if (kind === 'pica')    return `${ids[0]}:${Math.max(1, Math.min(3, picas))}`;
  return ids[0];
};
window.colorLabel = function (val) {
  const { kind, ids, picas } = window.parseColor(val);
  const n1 = window.colorById(ids[0]).name;
  if (kind === 'solid')   return n1;
  if (kind === 'bicolor') return `${n1}/${window.colorById(ids[1]).name}`;
  // pica
  return `${n1} ${'/'.repeat(picas)}`;
};
// Generate CSS background for any color value
window.colorBg = function (val, dir = '180deg') {
  const { kind, ids, picas } = window.parseColor(val);
  const c1 = window.colorById(ids[0]).hex;
  if (kind === 'solid') return c1;
  if (kind === 'bicolor') {
    const c2 = window.colorById(ids[1]).hex;
    return `linear-gradient(${dir}, ${c1} 0%, ${c1} 50%, ${c2} 50%, ${c2} 100%)`;
  }
  // pica: N horizontal black stripes on c1 base
  // Use bright contrast for very dark bases (negro)
  const isDarkBase = ids[0] === 'negro';
  const mark = isDarkBase ? '#ffffff' : '#000000';
  // Stripes ~7% tall, evenly spaced
  const stripeW = 7; // %
  if (picas === 1) {
    return `linear-gradient(${dir},
      ${c1} 0%, ${c1} 46%,
      ${mark} 46%, ${mark} ${46+stripeW}%,
      ${c1} ${46+stripeW}%, ${c1} 100%)`;
  }
  if (picas === 2) {
    return `linear-gradient(${dir},
      ${c1} 0%, ${c1} 30%,
      ${mark} 30%, ${mark} ${30+stripeW}%,
      ${c1} ${30+stripeW}%, ${c1} 62%,
      ${mark} 62%, ${mark} ${62+stripeW}%,
      ${c1} ${62+stripeW}%, ${c1} 100%)`;
  }
  // 3 picas
  return `linear-gradient(${dir},
    ${c1} 0%, ${c1} 22%,
    ${mark} 22%, ${mark} ${22+stripeW}%,
    ${c1} ${22+stripeW}%, ${c1} 46%,
    ${mark} 46%, ${mark} ${46+stripeW}%,
    ${c1} ${46+stripeW}%, ${c1} 70%,
    ${mark} 70%, ${mark} ${70+stripeW}%,
    ${c1} ${70+stripeW}%, ${c1} 100%)`;
};
// Resolve free-text like "Rojo", "Rojo/Azul", "Rojo /", "Rojo //", "Rojo ///",
// "Rojo:1", "Rojo 2 picas"
window.parseColorName = function (s) {
  const norm = (x) => String(x).toLowerCase().trim()
    .normalize('NFD').replace(/\p{Diacritic}/gu, '');
  let str = String(s).trim();
  // 1) explicit pica with ':N'
  let m = str.match(/^(.+?)\s*:\s*([123])\s*$/);
  if (m) {
    const base = window.PALETTE.find(c => norm(c.name) === norm(m[1]) || c.id === norm(m[1]));
    if (base) return `${base.id}:${m[2]}`;
  }
  // 2) "Rojo 2 picas" / "rojo 2pica"
  m = str.match(/^(.+?)\s+([123])\s*picas?\s*$/i);
  if (m) {
    const base = window.PALETTE.find(c => norm(c.name) === norm(m[1]) || c.id === norm(m[1]));
    if (base) return `${base.id}:${m[2]}`;
  }
  // 3) "Rojo /", "Rojo //", "Rojo ///"
  m = str.match(/^(.+?)\s*(\/{1,3})\s*$/);
  if (m && !m[1].includes('/')) {
    const base = window.PALETTE.find(c => norm(c.name) === norm(m[1]) || c.id === norm(m[1]));
    if (base) return `${base.id}:${m[2].length}`;
  }
  // 4) Bicolor "Rojo/Azul"
  if (str.includes('/')) {
    const parts = str.split('/').map(p => norm(p));
    const ids = parts.map(np => {
      const f = window.PALETTE.find(c => norm(c.name) === np || c.id === np);
      return f ? f.id : null;
    }).filter(Boolean);
    if (ids.length >= 2) return `${ids[0]}/${ids[1]}`;
    if (ids.length === 1) return ids[0];
    return null;
  }
  // 5) Plain color name
  const np = norm(str);
  const f = window.PALETTE.find(c => norm(c.name) === np || c.id === np);
  return f ? f.id : null;
};

window._bootstrapFromFactoryHTTP = async function () {
  // Only on first run (or if user explicitly resets the boot flag)
  if (localStorage.getItem(window.FACTORY_BOOT_KEY)) return null;
  try {
    // Try several paths so the JSON loads from local file, HTTP server, or root
    const candidates = [
      './assets/factory-backup.json',
      'assets/factory-backup.json',
      './factory-backup.json',
    ];
    let data = null;
    for (const url of candidates) {
      try {
        const r = await fetch(url, { cache: 'no-cache' });
        if (r.ok) { data = await r.json(); break; }
      } catch {}
    }
    if (!data) return null;
    // Apply
    if (Array.isArray(data.cables) && data.cables.length) {
      localStorage.setItem(window.STORAGE_KEY, JSON.stringify(data.cables));

    if (data.reference) {

let _zipPromise = null;
window.loadJSZip = function () {
  if (window.JSZip) return Promise.resolve(window.JSZip);
  if (_zipPromise) return _zipPromise;
  _zipPromise = new Promise((resolve, reject) => {

    document.head.appendChild(s);
  });
  return _zipPromise;
};

// Convert dataURL to a Uint8Array (for putting into ZIP)
function _dataUrlToBytes(dataUrl) {
  const m = String(dataUrl).match(/^data:[^;]+;base64,(.+)$/);
  if (!m) return null;
  const bin = atob(m[1]);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// Download a COMPLETE backup: cables + reference + gallery state + ALL photos
// from IndexedDB. Produces a ZIP file.
window.downloadCompleteBackup = async function (cables) {
  const JSZip = await window.loadJSZip();
  const zip = new JSZip();
  const ref = window.loadReference();
  const gal = window.loadGalleryState();
  const photoKeys = await window.photoDB.allKeys();
  // Reduce cables to remove photoIds that no longer exist
  const photosMap = {};
  for (const id of photoKeys) {
    const dataUrl = await window.photoDB.get(id);
    if (!dataUrl) continue;
    photosMap[id] = dataUrl;
  }
  const data = {
    app: 'codigoFibras',
    version: 3,
    exportedAt: new Date().toISOString(),
    isCompleteBackup: true,
    cables, reference: ref,
    galleryCustom: gal.customItems || [],
    galleryOverrides: gal.overrides || {},
    photoIds: Object.keys(photosMap),
  };
  zip.file('data.json', JSON.stringify(data, null, 2));
  const photosFolder = zip.folder('photos');
  for (const [id, dataUrl] of Object.entries(photosMap)) {
    const bytes = _dataUrlToBytes(dataUrl);
    if (!bytes) continue;
    const m = dataUrl.match(/^data:image\/(\w+);/);
    const ext = (m && m[1] === 'png') ? 'png' : 'jpg';
    photosFolder.file(`${id}.${ext}`, bytes);
  }
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  a.href = url;
  a.download = `codigo-fibras-completo-${stamp}.zip`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
};

// Restore from a complete ZIP backup. Returns { cables } so caller can setState.
window.restoreCompleteBackup = async function (file) {
  const JSZip = await window.loadJSZip();
  const ab = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(ab);
  const dataFile = zip.file('data.json');
  if (!dataFile) throw new Error('El ZIP no contiene data.json');
  const data = JSON.parse(await dataFile.async('string'));
  if (!data.cables) throw new Error('Datos incompletos');
  // Restore photos to IDB
  const photoFiles = zip.folder('photos');
  if (photoFiles) {
    const filesObj = zip.files;
    for (const path of Object.keys(filesObj)) {
      if (!path.startsWith('photos/') || filesObj[path].dir) continue;
      const m = path.match(/photos\/([^.]+)\.\w+$/);
      if (!m) continue;
      const id = m[1];
      const blob = await filesObj[path].async('blob');
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.readAsDataURL(blob);
      });
      await window.photoDB.put(id, dataUrl);
    }
  }
  if (data.reference) localStorage.setItem(window.REF_KEY, JSON.stringify(data.reference));
  if (data.galleryCustom || data.galleryOverrides) {
    localStorage.setItem(window.GALLERY_KEY, JSON.stringify({
      customItems: data.galleryCustom || [],
      overrides: data.galleryOverrides || {},
    }));
  }
  return data.cables;
};

// ---- Photo IndexedDB (for big photos, beyond localStorage limits) ------------
// Stores photo dataUrl by id. Used by cable photos and user-added gallery items.
const _IDB_NAME = 'codigoFibras';
const _IDB_VER = 1;
let _idbPromise = null;
function _openIDB() {
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(_IDB_NAME, _IDB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _idbPromise;
}
window.photoDB = {
  async put(id, dataUrl) {
    const db = await _openIDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').put(dataUrl, id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async get(id) {
    const db = await _openIDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readonly');
      const r = tx.objectStore('photos').get(id);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => rej(r.error);
    });
  },
  async delete(id) {
    const db = await _openIDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async allKeys() {
    const db = await _openIDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readonly');
      const r = tx.objectStore('photos').getAllKeys();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  },
};

// ---- Fuzzy match: lowercase, accent-insensitive, substring or token-wise -----
window.fuzzyMatch = function (needle, haystacks) {
  const norm = (s) => String(s || '').toLowerCase()
    .normalize('NFD').replace(/\p{Diacritic}/gu, '');
  const n = norm(needle).trim();
  if (!n) return true;
  const tokens = n.split(/\s+/).filter(Boolean);
  const hay = haystacks.map(norm).join(' ');
  return tokens.every(t => hay.includes(t));
};
window.resizePhotoFile = function (file, { maxDim = 1600, quality = 0.85, mime = 'image/jpeg' } = {}) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Imagen inválida'));
      img.onload = () => {
        let { width: w, height: h } = img;
        if (Math.max(w, h) > maxDim) {
          const k = maxDim / Math.max(w, h);
          w = Math.round(w * k);
          h = Math.round(h * k);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL(mime, quality);
        resolve({ dataUrl, width: w, height: h, bytes: Math.round(dataUrl.length * 0.75) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
};
window.fmtBytes = function (n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';

};

// Header normalization for tolerant matching
const _normHdr = (s) => String(s || '').toLowerCase().trim()
  .normalize('NFD').replace(/\p{Diacritic}/gu, '')
  .replace(/\s+/g, ' ');

const HEADER_MAP = {
  nombre: 'name', name: 'name', cable: 'name',
  operadora: 'operator', operador: 'operator', operator: 'operator',
  tubos: 'tubeCount', tubes: 'tubeCount',
  fibras: 'fiberCount', fibras_por_tubo: 'fiberCount', 'fibras por tubo': 'fiberCount', fibers: 'fiberCount',
  'secuencia tubos': 'tubeSeq', 'tubos secuencia': 'tubeSeq', 'tube sequence': 'tubeSeq', tubos_seq: 'tubeSeq',
  'secuencia fibras': 'fiberSeq', 'fibras secuencia': 'fiberSeq', 'fiber sequence': 'fiberSeq', fibras_seq: 'fiberSeq',
  notas: 'notes', notes: 'notes', nota: 'notes',
};

window.importCablesFromExcel = async function (file) {
  const XLSX = await window.loadXLSX();
  const ab = await file.arrayBuffer();
  const wb = XLSX.read(ab, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
  if (rows.length === 0) throw new Error('La hoja está vacía');

  // Map headers (case/accent insensitive)
  const sample = rows[0];
  const keyMap = {}; // sheetKey -> normalizedField
  for (const k of Object.keys(sample)) {
    const target = HEADER_MAP[_normHdr(k)];
    if (target) keyMap[k] = target;
  }
  const needed = ['name','tubeSeq','fiberSeq'];
  const has = Object.values(keyMap);
  for (const n of needed) {
    if (!has.includes(n)) {
      throw new Error(`Falta la columna "${n === 'name' ? 'Nombre' : n === 'tubeSeq' ? 'Secuencia Tubos' : 'Secuencia Fibras'}"`);
    }
  }

  const cables = [];
  rows.forEach((row, i) => {
    const r = {};
    for (const [k, field] of Object.entries(keyMap)) r[field] = row[k];
    if (!r.name || !String(r.name).trim()) return;

    const tubeSeq = String(r.tubeSeq || '').split(/[,\n;]/).map(s => s.trim()).filter(Boolean);
    const fiberSeq = String(r.fiberSeq || '').split(/[,\n;]/).map(s => s.trim()).filter(Boolean);
    const tubeIds  = tubeSeq.map(s => window.parseColorName(s)).filter(Boolean);
    const fiberIds = fiberSeq.map(s => window.parseColorName(s)).filter(Boolean);
    if (tubeIds.length === 0 || fiberIds.length === 0) {
      throw new Error(`Fila ${i+2}: secuencia de tubos o fibras inválida`);
    }
    const tCount = parseInt(r.tubeCount) || tubeIds.length;
    const fCount = parseInt(r.fiberCount) || fiberIds.length;
    const tubes = [];
    for (let t = 0; t < tCount; t++) {
      const fibers = [];
      for (let f = 0; f < fCount; f++) fibers.push(fiberIds[f % fiberIds.length]);
      tubes.push({ colorId: tubeIds[t % tubeIds.length], fibers });
    }
    cables.push({
      id: window.uid(),
      name: String(r.name).trim(),
      operator: String(r.operator || '').trim(),
      notes: String(r.notes || '').trim(),
      tubes,
    });
  });

  if (cables.length === 0) throw new Error('No se importó ningún cable. ¿La hoja tiene la columna "Nombre"?');
  return cables;
};

  ];

  ws['!cols'] = [{wch:30},{wch:14},{wch:7},{wch:7},{wch:55},{wch:55},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Cables');
  XLSX.writeFile(wb, 'codigo-fibras-plantilla.xlsx');
};

// Find fiber by absolute number (1-based). Returns raw color values; caller renders them.
window.findFiberByNumber = function (cable, n) {
  let count = 0;
  for (let ti = 0; ti < cable.tubes.length; ti++) {
    const t = cable.tubes[ti];
    if (n > count && n <= count + t.fibers.length) {
      const fi = n - count - 1;
      return {
        tubeIdx: ti,
        fiberIdx: fi,
        tubeColor: t.colorId,
        fiberColor: t.fibers[fi],
        tubeLabel: window.colorLabel(t.colorId),
        fiberLabel: window.colorLabel(t.fibers[fi]),
        tubeNote: t.label || '',
      };
    }
    count += t.fibers.length;
  }
  return null;
};

function useToast() {
  const [m, setM] = useState('');
  const t = useRef(null);
  const show = useCallback((msg) => {
    setM(msg);
    clearTimeout(t.current);
    t.current = setTimeout(() => setM(''), 2200);
  }, []);
  return [show, m ? <div className="toast">{m}</div> : null];
}

}

// ---------- Photo loaded from IDB or URL ----------
function Photo({ photoId, dataUrl, src, alt, className, style, onClick }) {
  const [s, setS] = useState(src || dataUrl || null);
  useEffect(() => {
    if (src) { setS(src); return; }
    if (dataUrl) { setS(dataUrl); return; }
    if (!photoId) { setS(null); return; }
    let alive = true;
    window.photoDB.get(photoId).then(d => { if (alive) setS(d); });
    return () => { alive = false; };
  }, [photoId, dataUrl, src]);
  if (!s) return <div className={className} style={{...style, background: 'var(--bg-soft)'}} />;
  return <img src={s} alt={alt || ''} className={className} style={style} onClick={onClick} loading="lazy" />;
}

// ---------- Color picker body (reused inside ColorSheet) ----------
function ColorPicker({ value, onChange }) {
  const parsed = window.parseColor(value);
  const [kind, setKind] = useState(parsed.kind);
  const [c1, setC1] = useState(parsed.ids[0]);
  const [c2, setC2] = useState(parsed.ids[1] || 'azul');
  const [picas, setPicas] = useState(parsed.picas || 1);
  const [textInput, setTextInput] = useState(window.colorLabel(value));
  const [invalid, setInvalid] = useState(false);
  const lastEmit = useRef(value);

  useEffect(() => {
    const v = window.formatColor(kind, [c1, c2], picas);
    if (v === lastEmit.current) return;
    lastEmit.current = v;
    onChange(v);
    setTextInput(window.colorLabel(v));
    setInvalid(false);
  }, [kind, c1, c2, picas]);

  const onText = (t) => {
    setTextInput(t);
    const parsedVal = window.parseColorName(t);
    if (!parsedVal) { setInvalid(true); return; }
    setInvalid(false);
    const p = window.parseColor(parsedVal);
    lastEmit.current = parsedVal;
    setKind(p.kind); setC1(p.ids[0]);
    if (p.ids[1]) setC2(p.ids[1]);
    if (p.picas) setPicas(p.picas);
    onChange(parsedVal);
  };

  const current = window.formatColor(kind, [c1, c2], picas);
  return (
    <>
      <div style={{display:'flex', alignItems:'center', gap: 12}}>
        <div className="pal-preview" style={{ background: window.colorBg(current) }} />
        <input className={`color-name-input ${invalid ? 'invalid' : ''}`}
               value={textInput} onChange={(e) => onText(e.target.value)}

// ---------- Cable editor sheet ----------
function CableSheet({ cable, allOperators, onCancel, onSave }) {
  const [draft, setDraft] = useState(() => JSON.parse(JSON.stringify(cable)));
  const [picking, setPicking] = useState(null);

  const update = (patch) => setDraft(d => ({ ...d, ...patch }));
  const setTubeCount = (n) => {
    n = Math.max(1, Math.min(64, parseInt(n) || 1));
    setDraft(d => {
      const tubes = [...d.tubes];
      const fcount = tubes[0]?.fibers.length || 8;
      const seqT = ['blanco','rojo','azul','verde','amarillo','violeta','naranja','gris','marron','negro','turquesa','rosa'];
      const seqF = ['rojo','azul','verde','amarillo','violeta','blanco','naranja','gris','marron','negro','turquesa','rosa'].slice(0, fcount);
      while (tubes.length < n) tubes.push({ colorId: seqT[tubes.length % seqT.length], fibers: [...seqF] });
      while (tubes.length > n) tubes.pop();
      return { ...d, tubes };
    });
  };
  const setFiberCount = (n) => {
    n = Math.max(1, Math.min(64, parseInt(n) || 1));
    setDraft(d => {
      const seqF = ['rojo','azul','verde','amarillo','violeta','blanco','naranja','gris','marron','negro','turquesa','rosa'];
      const tubes = d.tubes.map(t => {
        const fibers = [...t.fibers];
        while (fibers.length < n) fibers.push(seqF[fibers.length % seqF.length]);
        while (fibers.length > n) fibers.pop();
        return { ...t, fibers };
      });
      return { ...d, tubes };
    });
  };
  const setTube = (i, val, lbl) => setDraft(d => ({ ...d, tubes: d.tubes.map((t, ti) => ti === i ? { ...t, colorId: val, ...(lbl !== undefined ? { label: lbl } : {}) } : t) }));
  const setFiber = (i, val) => setDraft(d => ({ ...d, tubes: d.tubes.map(t => {
    const fibers = [...t.fibers]; if (i < fibers.length) fibers[i] = val;
    return { ...t, fibers };
  })}));

  const fperT = draft.tubes[0]?.fibers.length || 8;

  return (
    <Sheet
      title={cable._isNew ? 'Nuevo cable' : 'Editar cable'}
      onClose={onCancel}
      fullHeight
      footer={<>
        <button className="btn" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-primary" onClick={() => onSave(draft)}><ICheck /> Guardar</button>
      </>}>
      <div className="field">
        <label>Nombre</label>
        <input className="input" value={draft.name} onChange={(e) => update({ name: e.target.value })} />
      </div>
      <div className="field-row">
        <div className="field">
          <label>Operadora</label>
          <input className="input" list="op-dl" value={draft.operator || ''}
                 onChange={(e) => update({ operator: e.target.value })} placeholder="R CABLE…" />
          <datalist id="op-dl">
            {allOperators.map(o => <option key={o} value={o === window.NO_OPERATOR ? '' : o} />)}
          </datalist>
        </div>
        <div className="field">
          <label>Tipo</label>
          <input className="input" value={draft.type || ''} onChange={(e) => update({ type: e.target.value })} placeholder="Troncal…" />
        </div>
      </div>
      <div className="field-row">
        <div className="field">
          <label>Tubos</label>
          <input className="input mono" type="number" min="1" max="64" value={draft.tubes.length}
                 onChange={(e) => setTubeCount(e.target.value)} />
        </div>
        <div className="field">
          <label>Fibras/tubo</label>
          <input className="input mono" type="number" min="1" max="64" value={fperT}
                 onChange={(e) => setFiberCount(e.target.value)} />
        </div>
      </div>
      <div className="field">
        <label>Secuencia tubos · pulsa para editar</label>
        <SeqChips items={draft.tubes} getColor={(t) => t.colorId} baseLabel="T"
                  getSubtle={(i) => {
                    const base = draft.tubes.slice(0, i).reduce((s, t) => s + t.fibers.length, 0);
                    return `${base + 1}–${base + draft.tubes[i].fibers.length}`;
                  }}
                  onEdit={(i) => setPicking({ kind: 'tube', idx: i, value: draft.tubes[i].colorId })} />
      </div>
      <div className="field">
        <label>Secuencia fibras · pulsa para editar</label>
        <SeqChips items={draft.tubes[0]?.fibers || []} getColor={(v) => v} baseLabel="F"
                  onEdit={(i) => setPicking({ kind: 'fiber', idx: i, value: draft.tubes[0].fibers[i] })} />
      </div>
      {picking && (
        <ColorSheet
          title={picking.kind === 'tube' ? `Tubo ${picking.idx + 1}` : `Fibra pos. ${picking.idx + 1}`}
          value={picking.value}
          askLabel={picking.kind === 'tube'}
          label={picking.kind === 'tube' ? (draft.tubes[picking.idx].label || '') : ''}
          onCancel={() => setPicking(null)}
          onSave={(v, lbl) => {
            if (picking.kind === 'tube') setTube(picking.idx, v, lbl);
            else setFiber(picking.idx, v);
            setPicking(null);
          }} />
      )}
      )}
    </Sheet>
  );
}

// ---------- Info view (notes + photos) ----------
function InfoView({ cable, onUpdate, toast, locked }) {
  const [lightbox, setLightbox] = useState(null);
  const [maxDim, setMaxDim] = useState(1600);
  const [quality, setQuality] = useState(0.85);
  const fileRef = useRef(null);
  const photos = cable.photos || [];
  const totalBytes = photos.reduce((s, p) => s + (p.bytes || 0), 0);

  const onFiles = async (files) => {
    if (locked) { toast('Desbloquea el candado'); return; }
    const added = [];
    for (const f of Array.from(files)) {
      try {
        const r = await window.resizePhotoFile(f, { maxDim, quality });
        const photoId = await window.addPhotoToIDB(r.dataUrl);
        added.push({
          id: window.uid(), photoId, caption: '',
          width: r.width, height: r.height, bytes: r.bytes,
          createdAt: new Date().toISOString(),
        });
      } catch { toast('Error con ' + f.name); }
    }
    if (added.length) {
      onUpdate({ photos: [...photos, ...added] });
      toast(`${added.length} foto(s) añadida(s)`);
    }
  };

  const delPhoto = async (id) => {
    if (locked) { toast('Desbloquea el candado'); return; }
    if (!confirm('¿Borrar esta foto?')) return;
    const p = photos.find(x => x.id === id);
    if (p?.photoId) await window.photoDB.delete(p.photoId).catch(()=>{});
    onUpdate({ photos: photos.filter(p => p.id !== id) });
    setLightbox(null);
    toast('Foto borrada');
  };
  const updCap = (id, cap) => {
    if (locked) return;
    onUpdate({ photos: photos.map(p => p.id === id ? { ...p, caption: cap } : p) });
  };

  return (
    <div className="info-pad">
      <h2>Notas</h2>
      <textarea className="notes" value={cable.notes || ''}
                readOnly={locked}
                onChange={(e) => onUpdate({ notes: e.target.value })}
                placeholder={locked ? 'Desbloquea el candado para editar' : 'Apunta lo que necesites recordar…'} />

      <h2>
        Fotos <span className="count">{photos.length} · {window.fmtBytes(totalBytes)}</span>
      </h2>
      {!locked && (
        <div className="upload-opts">
          <div className="opt-row">
            <label>Tamaño</label>
            <select value={maxDim} onChange={(e) => setMaxDim(parseInt(e.target.value))}>
              <option value="800">Pequeña (800 px)</option>
              <option value="1600">Media (1600 px)</option>
              <option value="2400">Grande (2400 px)</option>
              <option value="4096">Original</option>
            </select>
          </div>
          <div className="opt-row">
            <label>Calidad</label>
            <input type="range" min="0.5" max="1" step="0.05" value={quality}
                   onChange={(e) => setQuality(parseFloat(e.target.value))} />
            <span className="mono" style={{fontSize: 12, color: 'var(--ink-3)', width: 36, textAlign: 'right'}}>
              {Math.round(quality * 100)}%
            </span>
          </div>
        </div>
      )}

      <div className="photo-grid">
        {!locked && (
          <button className="photo-add" onClick={() => fileRef.current.click()}>
            <div>
              <ICamera size={26} />
              <div style={{marginTop: 6, fontWeight: 600}}>Añadir</div>
            </div>
          </button>
        )}
        {photos.map((p, i) => (
          <div key={p.id} className="photo" onClick={() => setLightbox(i)}>
            <Photo photoId={p.photoId} dataUrl={p.dataUrl} alt={p.caption || ''} />
            <div className="meta">{p.width}×{p.height}</div>
          </div>
        ))}
      </div>
      <input ref={fileRef} type="file" accept="image/*" multiple style={{display:'none'}}
             onChange={(e) => { onFiles(e.target.files); e.target.value = ''; }} />

      {lightbox !== null && photos[lightbox] && (
        <div className="lightbox" onClick={(e) => e.target === e.currentTarget && setLightbox(null)}>
          <Photo photoId={photos[lightbox].photoId} dataUrl={photos[lightbox].dataUrl} alt="" />
          <button className="lb-close" onClick={() => setLightbox(null)}><IClose /></button>
          <div className="lb-cap">
            <input className="input" value={photos[lightbox].caption} readOnly={locked}
                   onChange={(e) => updCap(photos[lightbox].id, e.target.value)}
                   placeholder={locked ? '' : 'Descripción…'}
                   style={{background:'rgba(255,255,255,.1)', color:'white', borderColor:'rgba(255,255,255,.2)', textAlign:'center'}} />
            {!locked && (
              <button className="btn btn-danger" style={{marginTop: 10, background:'rgba(255,255,255,.1)'}}
                      onClick={() => delPhoto(photos[lightbox].id)}>
                <ITrash /> Borrar foto
              </button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// Gallery view (CTO photos)
// ============================================================
function GalleryView({ locked, toast }) {
  const [state, setState] = useState(() => window.loadGalleryState());
  const [search, setSearch] = useState('');
  const [activeCat, setActiveCat] = useState('all');
  const [lightboxId, setLightboxId] = useState(null);
  const fileRef = useRef(null);
  useEffect(() => { window.saveGalleryState(state); }, [state]);

  const composed = window.composeGallery(state);
  const visible = composed.filter(g => !g.hidden);

  const cats = useMemo(() => {
    const map = new Map();
    visible.forEach(g => map.set(g.category, (map.get(g.category) || 0) + 1));
    return Array.from(map.entries()).sort((a, b) => b[1] - a[1]);
  }, [visible]);

  const filtered = visible.filter(g =>
    (activeCat === 'all' || g.category === activeCat) &&
    window.fuzzyMatch(search, [g.name, g.category])
  );

  const onFiles = async (files) => {
    if (locked) { toast('Desbloquea el candado'); return; }
    const newCustoms = [];
    for (const f of Array.from(files)) {
      try {
        const r = await window.resizePhotoFile(f, { maxDim: 1200, quality: 0.78 });
        const photoId = await window.addPhotoToIDB(r.dataUrl);
        newCustoms.push({
          id: 'gal-c-' + Math.random().toString(36).slice(2, 8),
          name: f.name.replace(/\.[^.]+$/, ''),
          category: 'Mis fotos',
          photoId,
          w: r.width, h: r.height, bytes: r.bytes,
        });
      } catch { toast('Error con ' + f.name); }
    }
    if (newCustoms.length) {
      setState(s => ({ ...s, customItems: [...(s.customItems || []), ...newCustoms] }));
      toast(`${newCustoms.length} foto(s) añadida(s)`);
    }
  };

  const updItem = (id, patch) => {
    if (locked) return;
    setState(s => {
      const isCustom = s.customItems?.some(c => c.id === id);
      if (isCustom) {
        return { ...s, customItems: s.customItems.map(c => c.id === id ? { ...c, ...patch } : c) };
      }
      return { ...s, overrides: { ...s.overrides, [id]: { ...(s.overrides[id] || {}), ...patch } } };
    });
  };

  const hideOrDelete = async (item) => {
    if (locked) { toast('Desbloquea el candado'); return; }
    if (item.isDefault) {
      if (!confirm(`¿Ocultar "${item.name}"?`)) return;
      updItem(item.id, { hidden: true });
      toast('Ocultada');
    } else {
      if (!confirm(`¿Borrar "${item.name}"?`)) return;
      if (item.photoId) await window.photoDB.delete(item.photoId).catch(()=>{});
      setState(s => ({ ...s, customItems: s.customItems.filter(c => c.id !== item.id) }));
      toast('Borrada');
    }
    setLightboxId(null);
  };

  const restoreHidden = () => {
    if (locked) { toast('Desbloquea el candado'); return; }
    setState(s => ({ ...s, overrides: Object.fromEntries(
      Object.entries(s.overrides).map(([k, v]) => [k, { ...v, hidden: false }])
    )}));
    toast('Fotos restauradas');
  };

  const current = lightboxId ? composed.find(g => g.id === lightboxId) : null;
  const hiddenCount = Object.values(state.overrides || {}).filter(o => o?.hidden).length;

  return (
    <div className="gal-section">
      <div className="gal-toolbar">
        <input className="gal-search" value={search}
               placeholder="Buscar…"
               onChange={(e) => setSearch(e.target.value)} />
        {!locked && (
          <button className="iconbtn" onClick={() => fileRef.current.click()}
                  style={{background:'var(--ink)', color:'var(--bg)', borderRadius: 12, width: 42, height: 42}}>
            <IPlus />
          </button>
        )}
      </div>

      <div className="gal-cats">
        <button className={`gal-cat ${activeCat === 'all' ? 'active' : ''}`} onClick={() => setActiveCat('all')}>
          Todas <span className="n">{visible.length}</span>
        </button>
        {cats.map(([c, n]) => (
          <button key={c} className={`gal-cat ${activeCat === c ? 'active' : ''}`} onClick={() => setActiveCat(c)}>
            {c} <span className="n">{n}</span>
          </button>
        ))}
      </div>

      <div className="gal-grid">
        {filtered.map(item => (
          <div key={item.id} className="gal-item" onClick={() => setLightboxId(item.id)}>
            <Photo photoId={item.isDefault ? null : item.photoId}
                   src={item.isDefault ? item.src : null}
                   alt={item.name} />
            <div className="gal-cap">
              {item.name}
              <div className="gal-meta">{item.category}</div>
            </div>
            {!locked && (
              <button className="gal-del" onClick={(e) => { e.stopPropagation(); hideOrDelete(item); }}>
                {item.isDefault ? <IClose size={14} /> : <ITrash size={14} />}
              </button>
            )}
          </div>
        ))}
      </div>

      {hiddenCount > 0 && !locked && (
        <div style={{marginTop: 16, color: 'var(--ink-3)', fontSize: 13, textAlign: 'center'}}>
          {hiddenCount} foto(s) oculta(s)
          <button className="btn btn-ghost" style={{marginLeft: 8, padding: '4px 10px', minHeight: 28, fontSize: 12}}
                  onClick={restoreHidden}>Restaurar</button>
        </div>
      )}

      <input ref={fileRef} type="file" accept="image/*" multiple style={{display: 'none'}}
             onChange={(e) => { onFiles(e.target.files); e.target.value = ''; }} />

      {current && (
        <div className="lightbox" onClick={(e) => e.target === e.currentTarget && setLightboxId(null)}>
          <Photo photoId={current.isDefault ? null : current.photoId}
                 src={current.isDefault ? current.src : null}
                 alt="" />
          <button className="lb-close" onClick={() => setLightboxId(null)}><IClose /></button>
          <div className="lb-cap">
            {locked ? (
              <>
                <div style={{fontSize: 15, fontWeight: 600}}>{current.name}</div>
                <div style={{fontSize: 12, opacity: .7, marginTop: 4}}>{current.category}</div>
              </>
            ) : (
              <>
                <input className="input" defaultValue={current.name}
                       onBlur={(e) => updItem(current.id, { name: e.target.value })}
                       style={{textAlign:'center', background:'rgba(255,255,255,.12)', color:'white', borderColor:'rgba(255,255,255,.2)'}} />
                <input className="input" defaultValue={current.category}
                       onBlur={(e) => updItem(current.id, { category: e.target.value })}
                       style={{textAlign:'center', marginTop: 8, background:'rgba(255,255,255,.12)', color:'white', borderColor:'rgba(255,255,255,.2)'}} />
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Cable list (operator-grouped) ----------
function ListView({ cables, selectedId, onSelect, onNewCable, onOpMenu, onMore, search, setSearch, collapsedOps, toggleOp }) {
  const grouped = useMemo(() => {
    const map = new Map();
    cables.forEach(c => {
      const op = (c.operator || '').trim() || window.NO_OPERATOR;
      if (!map.has(op)) map.set(op, []);
      map.get(op).push(c);
    });
    // Sort cables within each operator: by descending total fibers, then by name
    for (const list of map.values()) {
      list.sort((a, b) => {
        const fa = window.totalFibers(a), fb = window.totalFibers(b);
        if (fa !== fb) return fb - fa;
        return a.name.localeCompare(b.name, 'es');
      });
    }
    return Array.from(map.entries()).sort(([a], [b]) => {
      if (a === window.NO_OPERATOR) return 1;
      if (b === window.NO_OPERATOR) return -1;
      return a.localeCompare(b, 'es');
    });
  }, [cables]);

  const filtered = useMemo(() => {
    if (!search.trim()) return grouped;
    const q = search.trim().toLowerCase();
    return grouped
      .map(([op, list]) => [op, list.filter(c =>
        c.name.toLowerCase().includes(q) ||
        (c.type || '').toLowerCase().includes(q) ||
        op.toLowerCase().includes(q)
      )])
      .filter(([, list]) => list.length > 0);
  }, [grouped, search]);

  return (
    <>
      <div className="search-row">
        <input className="search-input" value={search}
               placeholder="Buscar cable u operadora…"
               onChange={(e) => setSearch(e.target.value)} />
        {search && (
          <button className="iconbtn" onClick={() => setSearch('')} aria-label="Limpiar"><IClose /></button>
        )}
      </div>

      {filtered.length === 0 ? (
        <div className="empty">
          <h2>{search ? 'Sin resultados' : 'No hay cables'}</h2>
          <p>{search ? 'Prueba con otro término' : 'Pulsa + para crear el primero'}</p>
        </div>
      ) : filtered.map(([op, list]) => (
        <div key={op} className={`op-group ${collapsedOps[op] ? 'collapsed' : ''}`}>
          <div className="op-head" onClick={() => toggleOp(op)}>
            <span className="chev"><IChevD size={18} /></span>
            <span>{op}</span>
            <span className="count">{list.length}</span>
            <button className="menu-btn" onClick={(e) => { e.stopPropagation(); onOpMenu(op, e.currentTarget); }}>
              <IDots size={18} />
            </button>
          </div>
          <div className="op-cables">
            {list.map(c => (
              <button key={c.id} className={`clitem ${c.id === selectedId ? 'active' : ''}`}
                      onClick={() => onSelect(c.id)}>
                <div className="cli-dots">
                  {c.tubes.slice(0, 4).map((t, i) =>
                    <span key={i} className="cli-dot" style={{ background: window.colorBg(t.colorId) }} />
                  )}
                </div>
                <div className="cli-body">
                  <div className="cli-name">{c.name}</div>
                  <div className="cli-sub">{c.type || `${c.tubes.length} tubos × ${c.tubes[0]?.fibers.length || 0} fibras`}</div>
                </div>
                <span className="cli-count mono">{window.totalFibers(c)}f</span>
              </button>
            ))}
          </div>
        </div>
      ))}
    </>
  );
}

// ---------- Cable view (with fiber search at top) ----------
function CableView({ cable, search, setSearch, highlight, onPick, onTubeEdit, onFiberEdit }) {
  if (!cable) {
    return (
      <div className="empty">
        <h2>Selecciona un cable</h2>
        <p>Ve a <b>Lista</b> y elige uno, o crea uno nuevo</p>
      </div>
    );
  }
  const lookup = useMemo(() => {
    const n = parseInt(search);
    if (!n || isNaN(n)) return null;
    return window.findFiberByNumber(cable, n);
  }, [search, cable]);

  return (
    <>
      <div className="search-row">
        <input className="search-input" inputMode="numeric" type="number"
               value={search} placeholder="Nº de fibra"
               onChange={(e) => setSearch(e.target.value)} />
        {search && (
          <button className="iconbtn" onClick={() => setSearch('')} aria-label="Limpiar"><IClose /></button>
        )}
      </div>
      <div className="canvas">
        {lookup && (
          <div className="lookup">
            <div className="lookup-num">{parseInt(search)}</div>
            <div className="lookup-body">
              <div className="lookup-row">
                <span style={{opacity:.7}}>Tubo</span>
                <span className="lookup-pill">
                  <span className="sw" style={{ background: window.colorBg(lookup.tubeColor) }} />
                  T{lookup.tubeIdx + 1} · {lookup.tubeLabel}
                  {lookup.tubeNote && <span style={{marginLeft:6, fontSize:10, opacity:.75, textTransform:'uppercase', letterSpacing:'.06em'}}>{lookup.tubeNote}</span>}
                </span>
                <span style={{opacity:.6}}>→</span>
                <span className="lookup-pill">
                  <span className="sw" style={{ background: window.colorBg(lookup.fiberColor) }} />
                  F{lookup.fiberIdx + 1} · {lookup.fiberLabel}
                </span>
              </div>
              <div className="lookup-row">
                Tubo T{lookup.tubeIdx + 1} · Fibras {cable.tubes.slice(0, lookup.tubeIdx).reduce((s, t) => s + t.fibers.length, 0) + 1}–{cable.tubes.slice(0, lookup.tubeIdx + 1).reduce((s, t) => s + t.fibers.length, 0)}
              </div>
            </div>
            <button className="lookup-x" onClick={() => setSearch('')}><IClose size={16} /></button>
          </div>
        )}

        <div className="ch-head">
          <h2>{cable.name}</h2>
          <div className="stats">
            <b>{cable.tubes.length}</b>T × <b>{cable.tubes[0]?.fibers.length || 0}</b>F · total <b>{window.totalFibers(cable)}</b>
            {cable.operator && <> · {cable.operator}</>}
            {cable.type && <> · {cable.type}</>}
          </div>
        </div>

        <div className="seq-card">
          <div className="seq-card-head">
            <h3>Secuencia tubos</h3>
            <span className="hint">pulsa chip</span>
          </div>
          <SeqChips items={cable.tubes} getColor={(t) => t.colorId} baseLabel="T"
                    getSubtle={(i) => {
                      const base = cable.tubes.slice(0, i).reduce((s, t) => s + t.fibers.length, 0);
                      return `${base + 1}–${base + cable.tubes[i].fibers.length}`;
                    }}
                    onEdit={(i) => onPick(`Tubo ${i + 1}`, cable.tubes[i].colorId,
                      (v, lbl) => onTubeEdit(i, v, lbl),
                      { askLabel: true, label: cable.tubes[i].label || '', kind: 'tube', idx: i })} />
        </div>
        <div className="seq-card">
          <div className="seq-card-head">
            <h3>Secuencia fibras</h3>
            <span className="hint">aplica a todos</span>
          </div>
          <SeqChips items={cable.tubes[0]?.fibers || []} getColor={(v) => v} baseLabel="F"
                    onEdit={(i) => onPick(`Fibra posición ${i + 1}`, cable.tubes[0].fibers[i],
                      (v) => onFiberEdit('all', i, v), { kind: 'fiber' })} />
        </div>

        {cable.tubes.map((t, ti) => {
          const base = cable.tubes.slice(0, ti).reduce((s, x) => s + x.fibers.length, 0);
          return (
            <TubeCard key={ti} tube={t} idx={ti} base={base}
                      highlight={highlight}
                      onTube={(i) => onPick(`Tubo ${i + 1}`, cable.tubes[i].colorId,
                        (v, lbl) => onTubeEdit(i, v, lbl),
                        { askLabel: true, label: cable.tubes[i].label || '', kind: 'tube', idx: i })}
                      onFiber={(i, fi) => onPick(`Fibra ${base + fi + 1}`, cable.tubes[i].fibers[fi],
                        (v) => onFiberEdit(i, fi, v), { kind: 'fiber' })} />
          );
        })}
        <div style={{ height: 30 }} />
      </div>
    </>
  );
}
