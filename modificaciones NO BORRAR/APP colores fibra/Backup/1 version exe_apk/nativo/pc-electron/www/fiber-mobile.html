               const f = e.target.files[0]; if (!f) return;
               try {
                 const imported = await window.importCablesFromExcel(f);
                 const mode = confirm(`Importar ${imported.length} cable(s)?\n\nOK = añadir a los existentes\nCancelar = reemplazar todos`);
                 setCables(mode ? [...cables, ...imported] : imported);
                 toast(`${imported.length} cable(s) importado(s)`);
               } catch (err) { alert('Error: ' + err.message); }
               e.target.value = '';
             }} />
      <input ref={zipRef} type="file" accept=".zip" style={{display:'none'}}
             onChange={async (e) => {
               const f = e.target.files[0]; if (!f) return;
               try {
                 const list = await window.restoreCompleteBackup(f);
                 if (confirm(`Restaurar ${list.length} cable(s) y todas las fotos?`)) {
                   setCables(list); toast('Restaurado');
                 }
               } catch (err) { alert('Error: ' + err.message); }
               e.target.value = '';
             }} />
    </div>
  );
}

// ============================================================
// Main App
// ============================================================
function App() {
  const [cables, setCables] = useState(() => window.loadCables());
  const [canInstall, setCanInstall] = useState(false);
  const [selectedId, setSelectedId] = useState(() => cables[0]?.id);
  const [theme, setTheme] = useState(() => localStorage.getItem(window.THEME_KEY) || 'light');
  const [tab, setTab] = useState('list'); // list | cable | info | more
  const [moreView, setMoreView] = useState('settings'); // settings | reference | gallery | help
  const [locked, setLocked] = useState(() => window.isLocked());
  const [cableSearch, setCableSearch] = useState('');
  const [listSearch, setListSearch] = useState('');
  const [collapsedOps, setCollapsedOps] = useState(() => {
    const initial = {};
    const sources = [];
    try { const raw = localStorage.getItem(window.STORAGE_KEY); if (raw) sources.push(JSON.parse(raw)); } catch {}
    if (window.FACTORY_DATA && Array.isArray(window.FACTORY_DATA.cables)) sources.push(window.FACTORY_DATA.cables);
    if (Array.isArray(window.DEFAULT_CABLES)) sources.push(window.DEFAULT_CABLES);
    for (const list of sources) {
      if (!Array.isArray(list)) continue;
      list.forEach(c => {
        const op = (c.operator || '').trim() || window.NO_OPERATOR;
        initial[op] = true;
      });
      if (Object.keys(initial).length) break;
    }
    return initial;
  });

  const [editorCable, setEditorCable] = useState(null);
  const [picker, setPicker] = useState(null);
  const [movingCable, setMovingCable] = useState(null);
  const [showWelcome, setShowWelcome] = useState(() => !localStorage.getItem('codigoFibras.welcome.dismissed'));
  const [opMenu, setOpMenu] = useState(null);
  const [cableMenu, setCableMenu] = useState(false);

  const [toast, toastView] = useToast();

  // Migrate old inline-photo cables to IDB on first load
  useEffect(() => {
    (async () => {
      const factory = await window.bootstrapFromFactory();
      if (factory && Array.isArray(factory.cables)) setCables(factory.cables);
      const changed = await window.migrateOldPhotos(cables);
      if (changed) setCables([...cables]);
    })();
    const onCan = () => setCanInstall(true);
    const onInst = () => setCanInstall(false);
    window.addEventListener('canInstallApp', onCan);
    window.addEventListener('appInstalled', onInst);
    if (window.__deferredInstall) setCanInstall(true);
    return () => {
      window.removeEventListener('canInstallApp', onCan);
      window.removeEventListener('appInstalled', onInst);
    };
    // eslint-disable-next-line
  }, []);

  const installApp = async () => {
    if (!window.__deferredInstall) return;
    window.__deferredInstall.prompt();
    await window.__deferredInstall.userChoice;
    window.__deferredInstall = null;
    setCanInstall(false);
  };

  useEffect(() => { window.saveCables(cables); }, [cables]);
  useEffect(() => { window.setLocked(locked); }, [locked]);
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(window.THEME_KEY, theme);
    // Update theme-color meta for mobile chrome
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'dark' ? '#0c0e11' : '#f6f5f1');
  }, [theme]);
  useEffect(() => {
    if (!cables.find(c => c.id === selectedId)) setSelectedId(cables[0]?.id);
  }, [cables, selectedId]);

  // dismiss menus on outside click
  useEffect(() => {
    const f = () => { setOpMenu(null); setCableMenu(false); };
    window.addEventListener('click', f);
    return () => window.removeEventListener('click', f);
  }, []);

  const selected = cables.find(c => c.id === selectedId);
  const allOperators = useMemo(() => window.listOperators(cables), [cables]);
  const highlight = useMemo(() => {
    if (!selected) return null;
    const n = parseInt(cableSearch);
    if (!n) return null;
    const r = window.findFiberByNumber(selected, n);
    return r ? { tubeIdx: r.tubeIdx, fiberIdx: r.fiberIdx } : null;
  }, [cableSearch, selected]);

  // Guard mutation actions when locked
  const guardLocked = (fn, msg = 'Desbloquea el candado primero') => (...args) => {
    if (locked) { toast(msg); return; }
    return fn(...args);
  };

  // Bloqueado: al pulsar un tubo, ir (scroll) a las fibras de ese tubo con su encabezado visible.
  const goToTube = (i) => {
    const el = document.getElementById('m-tubecard-' + i);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  // ---- handlers ----
  const updateCable = (id, patch) => setCables(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c));
  const updateSelected = (patch) => selected && updateCable(selected.id, patch);

  const onTubeEdit = guardLocked((idx, val, lbl) => {
    if (!selected) return;
    updateCable(selected.id, {
      tubes: selected.tubes.map((t, i) => i === idx ? { ...t, colorId: val, ...(lbl !== undefined ? { label: lbl } : {}) } : t),
    });
    toast('Tubo actualizado');
  });
  const onFiberEdit = guardLocked((tubeIdx, fiberIdx, val) => {
    if (!selected) return;
    updateCable(selected.id, {
      tubes: selected.tubes.map((t, i) => {
        if (tubeIdx !== 'all' && i !== tubeIdx) return t;
        const fibers = [...t.fibers];
        if (fiberIdx < fibers.length) fibers[fiberIdx] = val;
        return { ...t, fibers };
      }),
    });
    toast('Fibra actualizada');
  });

  const saveCable = guardLocked((draft) => {
    if (draft._isNew) {
      const newC = { ...draft, id: window.uid() };
      delete newC._isNew;
      setCables([...cables, newC]);
      setSelectedId(newC.id);
      toast('Cable creado');
      setTab('cable');
    } else {
      setCables(cables.map(c => c.id === draft.id ? draft : c));
      toast('Cable guardado');
    }
    setEditorCable(null);
  });
  const newCable = guardLocked((operator = '') => setEditorCable({
    _isNew: true, id: 'new', name: 'Nuevo cable',
    operator, type: '', notes: '', photos: [],
    tubes: [
      { colorId: 'blanco', fibers: ['rojo','azul','verde','amarillo'] },
      { colorId: 'rojo',   fibers: ['rojo','azul','verde','amarillo'] },
      { colorId: 'azul',   fibers: ['rojo','azul','verde','amarillo'] },
      { colorId: 'verde',  fibers: ['rojo','azul','verde','amarillo'] },
    ],
  }));
  const deleteCurrent = guardLocked(() => {
    if (!selected) return;
    if (!confirm(`¿Borrar "${selected.name}"?`)) return;
    setCables(cables.filter(c => c.id !== selected.id));
    toast('Cable borrado');
    setCableMenu(false);
  });
  const duplicateCurrent = guardLocked(() => {
    if (!selected) return;
    const copy = JSON.parse(JSON.stringify(selected));
    copy.id = window.uid();
    copy.name = selected.name + ' (copia)';
    setCables([...cables, copy]);
    setSelectedId(copy.id);
    toast('Cable duplicado');
    setCableMenu(false);
  });

  // Operator-level
  const renameOp = guardLocked((oldOp) => {
    const newOp = prompt(`Renombrar "${oldOp}" a:`, oldOp === window.NO_OPERATOR ? '' : oldOp);
    if (newOp === null) return;
    setCables(cs => cs.map(c => {
      const cop = (c.operator || '').trim() || window.NO_OPERATOR;
      return cop === oldOp ? { ...c, operator: newOp.trim() } : c;
    }));
    toast('Renombrada');
  });
  const deleteOp = guardLocked((op) => {
    const count = cables.filter(c => ((c.operator || '').trim() || window.NO_OPERATOR) === op).length;
    if (!confirm(`Eliminar "${op}"? Los ${count} cable(s) se moverán a "Sin operadora".`)) return;
    setCables(cs => cs.map(c => {
      const cop = (c.operator || '').trim() || window.NO_OPERATOR;
      return cop === op ? { ...c, operator: '' } : c;
    }));
    toast('Eliminada');
  });

  // ---- render ----
  const selectCable = (id) => {
    setSelectedId(id);
    setCableSearch('');
    setTab('cable');
    setTimeout(() => { const c = document.querySelector('.content'); if (c) c.scrollTop = 0; window.scrollTo(0, 0); }, 0);
  };

  return (
    <div className="app">
      <header className="topbar">
        {tab === 'cable' && selected && (
          <button className="iconbtn" onClick={() => setTab('list')} aria-label="Lista"><IBack /></button>
        )}
        {tab === 'more' && moreView !== 'settings' && (
          <button className="iconbtn" onClick={() => setMoreView('settings')} aria-label="Atrás"><IBack /></button>
        )}
        <h1>
          {tab === 'list' && 'Mis cables'}
          {tab === 'cable' && (selected?.name || 'Cable')}
          {tab === 'info' && (selected ? 'Información' : 'Info')}
          {tab === 'more' && moreView === 'settings' && 'Más'}
          {tab === 'more' && moreView === 'reference' && 'Referencia'}
          {tab === 'more' && moreView === 'gallery' && 'Galería CTOs'}
          {tab === 'more' && moreView === 'help' && 'Guía rápida'}
          {tab === 'cable' && selected && (
            <span className="sub">{selected.operator || window.NO_OPERATOR}</span>
          )}
          {tab === 'info' && selected && <span className="sub">{selected.name}</span>}
        </h1>
        <span className="aruiz-badge">A.Ruiz</span>
        <button className={`lock-pill ${locked ? '' : 'unlocked'}`}
                onClick={() => { setLocked(!locked); toast(locked ? '🔓 Desbloqueado' : '🔒 Bloqueado'); }}
                aria-label={locked ? 'Desbloquear' : 'Bloquear'}>
          {locked ? <ILock size={14} /> : <IUnlock size={14} />}
          {locked ? 'Bloqueado' : 'Editar'}
        </button>
        {tab === 'cable' && selected && (
          <>
            <button className="iconbtn" onClick={() => setEditorCable(selected)} aria-label="Editar" disabled={locked}><IEdit /></button>
            <button className="iconbtn" onClick={(e) => { e.stopPropagation(); setCableMenu(true); }} aria-label="Más"><IDots /></button>
          </>
        )}
        {tab === 'list' && (
          <button className="iconbtn theme-toggle" onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}>
            <span className="theme-icon-swap" key={theme}>{theme === 'light' ? <IMoon /> : <ISun />}</span>
          </button>
        )}
      </header>

      <main className="content">
        {tab === 'list' && (
          <ListView cables={cables} selectedId={selectedId} onSelect={selectCable}
                    onNewCable={() => newCable()}
                    onOpMenu={(op, btn) => {
                      if (locked) { toast('Desbloquea el candado'); return; }
                      const r = btn.getBoundingClientRect();
                      setOpMenu({ op, x: Math.max(8, r.right - 240), y: r.bottom + 6 });
                    }}
                    onMore={() => setTab('more')}
                    search={listSearch} setSearch={setListSearch}
                    collapsedOps={collapsedOps}
                    toggleOp={(op) => setCollapsedOps(s => ({ ...s, [op]: !s[op] }))} />
        )}
        {tab === 'cable' && (
          <CableView cable={selected} search={cableSearch} setSearch={setCableSearch}
                     highlight={highlight}
                     onPick={(title, value, onSave, opts) => {
                       if (locked) {
                         if (opts && opts.kind === 'tube') goToTube(opts.idx);
                         else toast('Desbloquea el candado para editar colores');
                         return;
                       }
                       setPicker({ title, value, onSave, askLabel: !!(opts && opts.askLabel), label: (opts && opts.label) || '' });
                     }}
                     onTubeEdit={onTubeEdit}
                     onFiberEdit={onFiberEdit} />
        )}
        {tab === 'info' && (
          selected ? <InfoView cable={selected} onUpdate={updateSelected} toast={toast} locked={locked} /> :
          <div className="empty">
            <h2>Selecciona un cable</h2>
            <p>Ve a <b>Lista</b> y elige uno</p>
          </div>
        )}
        {tab === 'more' && (
          moreView === 'reference' ? (
            <ReferenceView locked={locked} toast={toast} />
          ) : moreView === 'gallery' ? (
            <GalleryView locked={locked} toast={toast} />
          ) : moreView === 'help' ? (
            <HelpView />
          ) : (
            <SettingsView cables={cables} setCables={setCables}
                          theme={theme} setTheme={setTheme} toast={toast}
                          locked={locked}
                          canInstall={canInstall} installApp={installApp}
                          onShowWelcome={() => setShowWelcome(true)}
                          onOpenRef={() => setMoreView('reference')}
                          onOpenGallery={() => setMoreView('gallery')}
                          onOpenHelp={() => setMoreView('help')} />
          )
        )}
      </main>

      {/* FAB (only on list tab + unlocked) */}
      {(tab === 'list' && !locked) && (
        <button className="fab" onClick={() => newCable()} aria-label="Nuevo cable">
          <IPlus size={26} />
        </button>
      )}

      <nav className="tabbar">
        <button className={`tab ${tab === 'list' ? 'active' : ''}`} onClick={() => setTab('list')}>
          <span className="ico"><IList /></span>
          <span>Lista</span>
        </button>
        <button className={`tab ${tab === 'cable' ? 'active' : ''}`} onClick={() => setTab('cable')}>
          <span className="ico"><ICable /></span>
          <span>Cable</span>
        </button>
        <button className={`tab ${tab === 'info' ? 'active' : ''}`} onClick={() => setTab('info')}>
          <span className="ico"><IInfo /></span>
          <span>Info</span>
          {selected && (selected.photos?.length > 0 || selected.notes) && (
            <span className="badge">{selected.photos?.length || '!'}</span>
          )}
        </button>
        <button className={`tab ${tab === 'more' ? 'active' : ''}`} onClick={() => setTab('more')}>
          <span className="ico"><IMore /></span>
          <span>Más</span>
        </button>
      </nav>

      {/* Sheets / overlays */}
      {showWelcome && <WelcomeSheet onClose={() => setShowWelcome(false)} />}
      {editorCable && (
        <CableSheet cable={editorCable} allOperators={allOperators}
                    onCancel={() => setEditorCable(null)} onSave={saveCable} />
      )}
      {picker && (
        <ColorSheet title={picker.title} value={picker.value}
                    askLabel={picker.askLabel} label={picker.label}
                    onCancel={() => setPicker(null)}
                    onSave={(v, lbl) => { picker.onSave(v, lbl); setPicker(null); }} />
      )}
      {movingCable && (
        <MoveSheet cable={movingCable} allOperators={allOperators}
                   onCancel={() => setMovingCable(null)}
                   onMove={(op) => { updateCable(movingCable.id, { operator: op });
                                     setMovingCable(null); toast('Movido'); }} />
      )}

      {/* Operator menu (popover) */}
      {opMenu && (
        <div className="menu" style={{ left: opMenu.x, top: Math.min(opMenu.y, window.innerHeight - 280) }}
             onClick={(e) => e.stopPropagation()}>
          <button onClick={() => { newCable(opMenu.op === window.NO_OPERATOR ? '' : opMenu.op); setOpMenu(null); }}>
            <IPlus size={18} /> Añadir cable aquí
          </button>
          <button onClick={() => { renameOp(opMenu.op); setOpMenu(null); }}>
            <IEdit size={18} /> Renombrar operadora
          </button>
          <hr />
          <button className="danger" onClick={() => { deleteOp(opMenu.op); setOpMenu(null); }}>
            <ITrash size={18} /> Eliminar operadora
          </button>
        </div>
      )}

      {/* Cable menu (overflow ⋮) */}
      {cableMenu && selected && (
        <div className="menu" style={{ right: 12, top: 'calc(var(--header-h) + var(--safe-top) + 4px)' }}
             onClick={(e) => e.stopPropagation()}>
          <button onClick={() => { setMovingCable(selected); setCableMenu(false); }}>
            <IMove size={18} /> Mover a operadora
          </button>
          <button onClick={duplicateCurrent}>
            <ICopy size={18} /> Duplicar cable
          </button>
          <hr />
          <button className="danger" onClick={deleteCurrent}>
            <ITrash size={18} /> Borrar cable
          </button>
        </div>
      )}

      {toastView}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
  <script src="cf-enhance.js"></script>
</body>
</html>
