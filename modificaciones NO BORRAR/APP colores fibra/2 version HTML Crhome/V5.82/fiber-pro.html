<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#15171a" />
<title>Código Fibras — Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Light theme */
    --bg: #f6f5f1;
    --bg-elev: #ffffff;
    --bg-soft: #ecebe5;
    --ink: #15171a;
    --ink-2: #4a4f57;
    --ink-3: #8b9099;
    --line: #d9d8d2;
    --line-strong: #b9b7ad;
    --accent: #0f5132;
    --accent-ink: #ffffff;
    --warn: #c44d20;
    --danger: #b3261e;
    --chip: #ffffff;
    --chip-active-bg: #15171a;
    --chip-active-ink: #f6f5f1;
    --shadow-sm: 0 1px 0 rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 14px rgba(15,17,20,.08);
    --shadow-lg: 0 24px 48px -16px rgba(15,17,20,.18);
    --radius: 14px;
    --radius-sm: 10px;
    --fiber-w: 18px;
    --fiber-h: 56px;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #0c0e11;
    --bg-elev: #161a1f;
    --bg-soft: #1c2128;
    --ink: #f0eee6;
    --ink-2: #b0b6bf;
    --ink-3: #6a7280;
    --line: #262b32;
    --line-strong: #3a414a;
    --accent: #4ade80;
    --accent-ink: #0a0d10;
    --warn: #f59e0b;
    --danger: #f87171;
    --chip: #1c2128;
    --chip-active-bg: #f0eee6;
    --chip-active-ink: #0c0e11;
    --shadow-sm: 0 1px 0 rgba(0,0,0,.3);
    --shadow-md: 0 4px 14px rgba(0,0,0,.3);
    --shadow-lg: 0 24px 48px -16px rgba(0,0,0,.55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    font-feature-settings: 'ss01', 'cv11';
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; font-feature-settings: normal; }

  /* ---------- Layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: 1fr;
    min-height: 100dvh;
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
  }

  /* ---------- Sidebar ---------- */
  .side {
    border-right: 1px solid var(--line);
    background: var(--bg-elev);
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    position: sticky;
    top: 0;
  }
  @media (max-width: 900px) {
    .side {
      position: static;
      border-right: none;
      border-bottom: 1px solid var(--line);
      min-height: auto;
    }
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 20px 16px;
  }
  .brand-mark {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--ink);
    color: var(--bg);
    display: grid; place-items: center;
    font-family: 'Geist Mono', monospace;
    font-weight: 600; font-size: 18px;
    letter-spacing: -.04em;
  }
  .brand-name {
    font-weight: 700; letter-spacing: -.02em;
    font-size: 17px; line-height: 1.1;
  }
  .brand-sub {
    font-size: 11px; color: var(--ink-3);
    text-transform: uppercase; letter-spacing: .08em;
    margin-top: 2px;
  }
  .aruiz-badge {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px; font-weight: 700;
    letter-spacing: .04em;
    background: rgba(56, 134, 255, .18);
    color: #2563eb;
    border: 1px solid rgba(56, 134, 255, .35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(56,134,255,.12);
  }
  html[data-theme="dark"] .aruiz-badge {
    background: rgba(96, 165, 250, .18);
    color: #93c5fd;
    border-color: rgba(96, 165, 250, .35);
  }
  .side-section {
    padding: 14px 20px;
    border-top: 1px solid var(--line);
  }
  .side-section h4 {
    margin: 0 0 10px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--ink-3);
    font-weight: 600;
  }

  /* Cable list */
  .cable-list { display: flex; flex-direction: column; gap: 4px; }
  .cable-list-item {
    background: transparent;
    border: none;
    text-align: left;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--ink);
    cursor: pointer;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: center;
    font-size: 14px;
    line-height: 1.2;
    transition: background .12s ease;
  }
  .cable-list-item:hover { background: var(--bg-soft); }
  .cable-list-item.active { background: var(--ink); color: var(--bg); }
  .cable-list-item.active .cli-sub { color: var(--bg); opacity: .65; }
  .cli-dots {
    display: flex; gap: 3px;
  }
  .cli-dot {
    width: 8px; height: 8px; border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
  }
  .cli-body {
    display: flex; flex-direction: column; gap: 2px;
    overflow: hidden;
  }
  .cli-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cli-sub { font-size: 11px; color: var(--ink-3); }
  .cli-count {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-3);
    padding: 2px 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
  }
  .cable-list-item.active .cli-count {
    border-color: rgba(255,255,255,.2);
    color: rgba(255,255,255,.65);
  }

  /* Operator filter chips */
  .ops { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .op-chip {
    background: var(--bg-soft);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 5px 11px;
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
    transition: all .12s ease;
  }
  .op-chip:hover { border-color: var(--line-strong); }
  .op-chip.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .side-actions {
    margin-top: auto;
    padding: 14px 20px;
    display: flex; flex-direction: column; gap: 8px;
    border-top: 1px solid var(--line);
  }
  .btn {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: var(--bg-elev);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; justify-content: center;
    transition: all .12s ease;
  }
  .btn:hover { background: var(--bg-soft); }
  .btn-primary {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }
  .btn-primary:hover { opacity: .92; background: var(--ink); }
  .btn-ghost {
    background: transparent;
    border-color: transparent;
  }
  .btn-ghost:hover { background: var(--bg-soft); border-color: var(--line); }
  .btn-danger { color: var(--danger); border-color: var(--line); }
  .btn-danger:hover { background: color-mix(in srgb, var(--danger) 10%, var(--bg-elev)); }
  .btn-icon {
    width: 38px; height: 38px; padding: 0; border-radius: 10px;
    display: grid; place-items: center;
  }
  .btn-sm { padding: 6px 10px; font-size: 12px; }

  /* ---------- Main ---------- */
  .main {
    min-width: 0;
    padding: 0;
    display: flex; flex-direction: column;
  }
  .topbar {
    position: sticky; top: 0;
    z-index: 5;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  @media (max-width: 900px) {
    .topbar { padding: 12px 16px; }
  }
  .topbar-title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.01em;
    flex: 1;
    min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .topbar-meta {
    color: var(--ink-3);
    font-size: 12px;
    font-family: 'Geist Mono', monospace;
  }
  .topbar-actions { display: flex; gap: 6px; }

  /* Search */
  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-soft);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 8px 12px;
    transition: all .12s ease;
    flex: 0 0 240px;
  }
  .search-box:focus-within {
    border-color: var(--ink);
    background: var(--bg-elev);
    box-shadow: var(--shadow-sm);
  }
  .search-box input {
    border: none; background: transparent; outline: none;
    font-size: 14px; width: 100%;
    font-family: 'Geist Mono', monospace;
  }
  .search-box input::placeholder { color: var(--ink-3); font-family: 'Geist', sans-serif; }
  @media (max-width: 700px) { .search-box { flex: 1; } }

  /* Result panel for fiber lookup */
  .lookup-result {
    display: flex; align-items: center; gap: 14px;
    margin: 0 24px;
    margin-top: 16px;
    padding: 14px 18px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
  }
  @media (max-width: 900px) { .lookup-result { margin: 16px; } }
  .lookup-num {
    width: 56px; height: 56px;
    border-radius: 10px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-family: 'Geist Mono', monospace;
    font-size: 22px; font-weight: 600;
  }
  .lookup-info { flex: 1; min-width: 0; }
  .lookup-info-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--ink-2);
    flex-wrap: wrap;
  }
  .lookup-info-row + .lookup-info-row { margin-top: 4px; }
  .lookup-info b { color: var(--ink); font-weight: 600; }
  .color-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px 3px 4px;
    border-radius: 999px;
    background: var(--bg-soft);
    font-size: 12px;
    font-weight: 500;
  }
  .color-pill .swatch {
    width: 14px; height: 14px; border-radius: 999px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
  }

  /* ---------- Cable canvas ---------- */
  .canvas {
    padding: 24px;
    display: flex; flex-direction: column; gap: 18px;
    flex: 1;
  }
  @media (max-width: 900px) { .canvas { padding: 16px; gap: 14px; } }

  .cable-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px;
    padding-bottom: 8px;
  }
  .cable-header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.15;
  }
  @media (max-width: 700px) { .cable-header h1 { font-size: 20px; } }
  .cable-stats {
    margin-top: 6px;
    display: flex; gap: 14px; flex-wrap: wrap;
    color: var(--ink-3);
    font-size: 13px;
    font-family: 'Geist Mono', monospace;
  }
  .cable-stats b { color: var(--ink); font-weight: 600; }

  /* Tube card */
  .tube {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .tube-head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev);
  }
  .tube-num {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: var(--bg-soft);
    display: grid; place-items: center;
    font-family: 'Geist Mono', monospace;
    font-weight: 600; font-size: 13px;
    color: var(--ink-2);
  }
  .tube-color-pill {
    display: flex; align-items: center; gap: 9px;
    padding: 4px 12px 4px 4px;
    border-radius: 999px;
    background: var(--bg-soft);
    font-size: 13px; font-weight: 600;
  }
  .tube-color-pill .swatch {
    width: 22px; height: 22px;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.18);
  }
  .tube-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-3);
    padding: 3px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  .tube-spacer { flex: 1; }
  .tube-count {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--ink-3);
  }

  /* Fiber grid */
  .fibers {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px;
    padding: 14px;
  }
  .fiber {
    position: relative;
    border: 1px solid var(--line);
    background: var(--bg-elev);
    border-radius: var(--radius-sm);
    padding: 10px 6px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer;
    transition: all .14s ease;
  }
  .fiber:hover {
    border-color: var(--line-strong);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .fiber.highlight {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 18%, transparent);
    transform: translateY(-1px);
  }
  .fiber-stick {
    width: var(--fiber-w);
    height: var(--fiber-h);
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
    position: relative;
  }
  .fiber-stick::after {
    /* shine */
    content: '';
    position: absolute;
    left: 2px; top: 2px; bottom: 2px;
    width: 4px;
    background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0));
    border-radius: 4px 0 0 4px;
  }
  .fiber-num {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-3);
  }
  .fiber.highlight .fiber-num { color: var(--ink); font-weight: 600; }
  .fiber.bicolor .fiber-stick {
    background: var(--c1) !important;
    background-image: linear-gradient(180deg, var(--c1) 50%, var(--c2) 50%) !important;
  }

  /* ---------- Edit modal ---------- */
  .modal-back {
    position: fixed; inset: 0;
    background: color-mix(in srgb, var(--ink) 50%, transparent);
    z-index: 50;
    display: grid; place-items: center;
    padding: 16px;
    animation: fade .15s ease;
  }
  @keyframes fade { from { opacity: 0; } }
  .modal {
    background: var(--bg-elev);
    border-radius: 18px;
    border: 1px solid var(--line);
    max-width: 540px;
    width: 100%;
    max-height: 92dvh;
    overflow: auto;
    box-shadow: var(--shadow-lg);
    animation: pop .16s ease;
  }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
  .modal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
  }
  .modal-head h3 { margin: 0; font-size: 17px; flex: 1; }
  .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
  .modal-foot {
    display: flex; gap: 8px; justify-content: flex-end;
    padding: 14px 22px;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-3);
    font-weight: 600;
  }
  .input, .select, textarea.input {
    appearance: none;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--bg);
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    transition: border .12s ease, box-shadow .12s ease;
  }
  textarea.input { resize: vertical; min-height: 60px; font-family: inherit; }
  .input:focus, .select:focus, textarea.input:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 15%, transparent);
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Color picker grid */
  .color-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  .color-cell {
    aspect-ratio: 1;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    position: relative;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
    transition: transform .1s ease;
  }
  .color-cell:hover { transform: scale(1.05); }
  .color-cell.selected { border-color: var(--ink); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 0 0 0 1px var(--bg-elev); }
  .color-cell::after {
    content: attr(data-name);
    position: absolute;
    bottom: -16px; left: 50%; transform: translateX(-50%);
    font-size: 9px; color: var(--ink-3);
    white-space: nowrap;
    text-transform: uppercase; letter-spacing: .06em;
  }

  /* Tube editor row in cable editor */
  .tubes-edit {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 50dvh;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
  }
  .tube-edit-row {
    display: grid;
    grid-template-columns: 30px 1fr auto auto auto;
    gap: 8px;
    align-items: center;
    padding: 6px;
    border-radius: 8px;
  }
  .tube-edit-row:hover { background: var(--bg-soft); }
  .tube-edit-row .te-num {
    font-family: 'Geist Mono', monospace;
    color: var(--ink-3);
    font-size: 12px;
    text-align: right;
  }
  .tube-edit-row select { width: 100%; }
  .tube-edit-row .te-fcount {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--ink-3);
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    width: 64px;
    text-align: center;
  }

  /* Empty state */
  .empty {
    display: grid; place-items: center;
    padding: 60px 24px;
    text-align: center;
    color: var(--ink-3);
  }
  .empty h2 { color: var(--ink); margin: 0 0 8px; font-weight: 600; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 13px;
    z-index: 100;
    box-shadow: var(--shadow-lg);
    animation: toast .25s ease;
  }
  @keyframes toast { from { transform: translate(-50%, 12px); opacity: 0; } }

  /* Mobile cable picker (replaces sidebar on small screens) */
  /* Mobile cable picker (replaces sidebar on small screens) */
  .mobile-picker {
    display: none;
    flex-direction: column;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--line);
  }
  .mobile-picker-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
  }
  .mobile-picker-bar select {
    flex: 1;
    appearance: none;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    outline: none;
  }
  .mobile-picker-bar select:focus { border-color: var(--ink); }
  .mobile-picker-cables {
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 10px 14px;
    scroll-snap-type: x mandatory;
  }
  .mobile-picker .cli-mobile {
    flex: 0 0 auto;
    scroll-snap-align: start;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg-elev);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    color: var(--ink);
  }
  .mobile-picker .cli-mobile.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  @media (max-width: 900px) {
    .mobile-picker { display: flex; }
    .side-cable-list-wrap { display: none; }
  }

  /* Hide hover description on mobile */
  @media (hover: none) {
    .color-cell::after { display: none; }
  }

  /* ---------- Operator groups in sidebar ---------- */
  .op-group { margin-bottom: 8px; }
  .op-group-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    color: var(--ink);
    background: var(--bg-soft);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .1em;
    font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    user-select: none;
    border-left: 3px solid var(--ink);
    margin-top: 8px;
  }
  .op-group-head:hover { background: var(--bg-soft); color: var(--ink); }
  .op-group-head .op-chev {
    transition: transform .15s ease;
    color: var(--ink-3);
  }
  .op-group.collapsed .op-chev { transform: rotate(-90deg); }
  .op-group.collapsed .cable-list { display: none; }
  .op-group-head .op-count {
    font-family: 'Geist Mono', monospace;
    font-weight: 500;
    color: var(--ink-3);
  }
  .op-menu-btn {
    margin-left: auto;
    background: transparent; border: none;
    color: var(--ink-3); cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    line-height: 0;
  }
  .op-menu-btn:hover { background: var(--bg-elev); color: var(--ink); }

  /* ---------- Tabs (Cable / Info) ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  @media (max-width: 900px) { .tabs { padding: 0 16px; } }
  .tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-2);
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .tab .badge {
    background: var(--bg-soft);
    color: var(--ink-2);
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-family: 'Geist Mono', monospace;
  }
  .tab.active .badge { background: var(--ink); color: var(--bg); }

  /* ---------- Sequence editor (always visible) ---------- */
  .seq-card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .seq-card-head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .seq-card-head h3 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-2);
  }
  .seq-card-head .hint {
    font-size: 11px;
    color: var(--ink-3);
    margin-left: auto;
    font-family: 'Geist Mono', monospace;
  }
  .seq-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .seq-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 4px;
    border-radius: 999px;
    background: var(--bg-soft);
    font-size: 12px;
    font-weight: 500;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .12s ease;
  }
  .seq-chip:hover {
    border-color: var(--line-strong);
    background: var(--bg-elev);
  }
  .seq-chip .sw {
    width: 22px; height: 22px;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.2);
    flex-shrink: 0;
  }
  .seq-chip .idx {
    font-family: 'Geist Mono', monospace;
    color: var(--ink-3);
    font-size: 10px;
    margin-right: 2px;
  }

  /* ---------- Pattern picker (solid/bicolor/pica) ---------- */
  .pat-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--bg-soft);
    padding: 4px;
    border-radius: 10px;
  }
  .pat-tab {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-2);
    padding: 8px 10px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .pat-tab:hover { color: var(--ink); }
  .pat-tab.active {
    background: var(--bg-elev);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .pat-preview {
    width: 18px; height: 18px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.2);
    flex-shrink: 0;
  }

  /* Live color name input */
  .color-name-input {
    width: 100%;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    background: var(--bg);
    outline: none;
    transition: border .12s ease, box-shadow .12s ease;
  }
  .color-name-input:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink) 14%, transparent);
  }
  .color-name-input.invalid {
    border-color: var(--danger);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 14%, transparent);
  }

  /* ---------- Info / Notes tab ---------- */
  .info-section {
    display: flex; flex-direction: column; gap: 16px;
    padding: 24px;
  }
  @media (max-width: 900px) { .info-section { padding: 16px; gap: 12px; } }
  .info-section h2 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .notes-area {
    width: 100%;
    min-height: 140px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg-elev);
    color: var(--ink);
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.6;
    font-family: inherit;
    resize: vertical;
    outline: none;
    transition: border .12s ease;
  }
  .notes-area:focus { border-color: var(--ink); }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
  }
  .photo-card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .photo-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .photo-card img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
  }
  .photo-card .caption {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--ink-2);
    border-top: 1px solid var(--line);
    background: var(--bg-elev);
    display: flex; align-items: center; gap: 8px;
  }
  .photo-card .caption input {
    flex: 1; min-width: 0;
    border: none; background: transparent;
    color: inherit;
    outline: none;
    font-size: 12px;
    font-family: inherit;
  }
  .photo-card .ph-del {
    position: absolute;
    top: 6px; right: 6px;
    background: rgba(0,0,0,.6);
    color: white;
    border: none;
    width: 28px; height: 28px;
    border-radius: 999px;
    cursor: pointer;
    display: grid; place-items: center;
    opacity: 0;
    transition: opacity .12s ease;
  }
  .photo-card:hover .ph-del,
  .photo-card:focus-within .ph-del { opacity: 1; }
  .photo-meta {
    position: absolute;
    bottom: 38px; left: 8px;
    background: rgba(0,0,0,.55);
    color: white;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-family: 'Geist Mono', monospace;
  }

  .photo-add {
    aspect-ratio: 4/3;
    border: 2px dashed var(--line-strong);
    border-radius: var(--radius);
    display: grid; place-items: center;
    color: var(--ink-3);
    cursor: pointer;
    text-align: center;
    padding: 18px;
    font-size: 13px;
    transition: all .14s ease;
    background: transparent;
  }
  .photo-add:hover { border-color: var(--ink); color: var(--ink); background: var(--bg-elev); }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.9);
    z-index: 80;
    display: grid; place-items: center;
    padding: 24px;
    cursor: pointer;
  }
  .lightbox img {
    max-width: 100%; max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }

  /* Photo upload settings */
  .upload-opts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg-soft);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .upload-opts .field {
    flex: 1; min-width: 0;
  }

  /* Welcome modal extras */
  .welcome-body { line-height: 1.6; font-size: 14px; color: var(--ink-2); }
  .welcome-body b { color: var(--ink); }
  .welcome-body code {
    background: var(--bg-soft);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: var(--ink);
  }
  .welcome-body ul { padding-left: 18px; margin: 10px 0; }
  .welcome-body li { margin: 6px 0; }
  .welcome-warn {
    background: color-mix(in srgb, var(--warn) 10%, var(--bg-elev));
    border-left: 3px solid var(--warn);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin: 10px 0;
  }
  .dontshow {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    user-select: none;
  }

  /* Action menu (cable card) */
  .menu {
    position: absolute;
    z-index: 30;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 4px;
    box-shadow: var(--shadow-lg);
    min-width: 180px;
  }
  .menu button {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    color: var(--ink);
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; gap: 8px;
  }
  .menu button:hover { background: var(--bg-soft); }
  .menu button.danger { color: var(--danger); }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }

  /* Lock pill in topbar */
  .lock-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--bg-soft);
    color: var(--ink-2);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .lock-pill:hover { background: var(--bg-elev); border-color: var(--line-strong); }
  .lock-pill.unlocked {
    background: color-mix(in srgb, var(--accent) 18%, var(--bg-elev));
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 35%, transparent);
  }
  html[data-theme="dark"] .lock-pill.unlocked {
    background: color-mix(in srgb, var(--accent) 22%, transparent);
  }

  /* Sidebar section nav (Cables / Referencia / Galería) */
  .nav-section { padding: 14px 18px 0; }
  .nav-btn {
    width: 100%;
    background: transparent;
    border: 1px solid transparent;
    text-align: left;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--ink);
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 3px;
  }
  .nav-btn:hover { background: var(--bg-soft); }
  .nav-btn.active {
    background: var(--ink);
    color: var(--bg);
  }
  .nav-btn .ico { width: 18px; display: grid; place-items: center; }

  /* Reference table */
  .ref-section {
    padding: 24px;
    display: flex; flex-direction: column; gap: 18px;
  }
  @media (max-width: 900px) { .ref-section { padding: 16px; } }
  .ref-section h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .ref-card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .ref-card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  .ref-card-head h3 {
    margin: 0; flex: 1;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--ink-2);
  }
  .ref-card-head .add-btn {
    background: var(--bg-soft);
    border: none;
    color: var(--ink);
    width: 30px; height: 30px;
    border-radius: 8px;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .ref-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .ref-table th, .ref-table td {
    text-align: left;
    padding: 11px 18px;
    border-bottom: 1px solid var(--line);
  }
  .ref-table th {
    background: var(--bg-soft);
    font-size: 11px;
    color: var(--ink-2);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .ref-table tr:last-child td { border-bottom: none; }
  .ref-table .row-action { width: 40px; text-align: right; }
  .ref-table .row-action button {
    background: transparent;
    border: none;
    color: var(--ink-3);
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .ref-table .row-action button:hover { color: var(--danger); background: var(--bg-soft); }
  .ref-table input[type=text] {
    width: 100%;
    border: none;
    background: transparent;
    color: inherit;
    font: inherit;
    outline: none;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .ref-table input[type=text]:focus {
    background: var(--bg-soft);
    box-shadow: inset 0 0 0 1px var(--ink);
  }

  /* Gallery */
  .gal-section {
    padding: 24px;
  }
  @media (max-width: 900px) { .gal-section { padding: 16px; } }
  .gal-section h1 {
    margin: 0 0 14px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -.02em;
  }
  .gal-toolbar {
    display: flex; gap: 10px; align-items: center; margin-bottom: 14px;
  }
  .gal-search {
    flex: 1;
    height: 42px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg-elev);
    color: var(--ink);
    padding: 0 14px;
    font-size: 14px;
    outline: none;
  }
  .gal-search:focus { border-color: var(--ink); }
  .gal-cats {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
  }
  .gal-cat {
    background: var(--bg-soft);
    border: 1px solid transparent;
    color: var(--ink-2);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .gal-cat.active {
    background: var(--ink);
    color: var(--bg);
  }
  .gal-cat .n {
    margin-left: 5px;
    color: var(--ink-3);
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
  }
  .gal-cat.active .n { color: var(--bg); opacity: .65; }

  .gal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .gal-item {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .gal-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .gal-item img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    display: block;
    background: var(--bg-soft);
  }
  .gal-item .gal-cap {
    padding: 10px 12px;
    font-size: 12px;
    font-weight: 500;
    line-height: 1.3;
    border-top: 1px solid var(--line);
  }
  .gal-item .gal-meta {
    font-size: 10px;
    color: var(--ink-3);
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .gal-item .gal-del {
    position: absolute;
    top: 8px; right: 8px;
    width: 30px; height: 30px;
    border-radius: 999px;
    background: rgba(0,0,0,.6);
    color: white;
    border: none;
    display: grid; place-items: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity .12s ease;
  }
  .gal-item:hover .gal-del { opacity: 1; }

  .gal-add {
    aspect-ratio: 4/3;
    border: 2px dashed var(--line-strong);
    border-radius: 12px;
    display: grid; place-items: center;
    color: var(--ink-3);
    background: transparent;
    cursor: pointer;
    text-align: center;
    padding: 14px;
    font-size: 13px;
    font-weight: 500;
  }
  .gal-add:hover { border-color: var(--ink); color: var(--ink); background: var(--bg-elev); }

  /* Scrollbar polish */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Link */
  a.subtle { color: var(--ink-3); font-size: 12px; text-decoration: none; }
  a.subtle:hover { color: var(--ink); text-decoration: underline; }

  .signature { display: none; }

  /* Animations */
  .theme-toggle { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
  .theme-toggle:hover { transform: rotate(180deg) scale(1.06); }
  .theme-toggle:active { transform: rotate(180deg) scale(.94); }
  .lock-pill { transition: background .15s ease, color .15s ease, border-color .15s ease, transform .12s ease; }
  .lock-pill:active { transform: scale(.95); }
  .nav-btn { transition: background .15s ease, color .15s ease, transform .08s ease; }
  .nav-btn:active { transform: scale(.98); }
  .seq-chip { transition: background .14s ease, border-color .14s ease, transform .08s ease; }
  .seq-chip:hover { transform: translateY(-1px); }
  .seq-chip:active { transform: translateY(0) scale(.97); }
  .cable-list-item { transition: background .14s ease, padding-left .14s ease; }
  .op-group-head { transition: background .14s ease; }
  .btn { transition: background .14s ease, transform .08s ease, box-shadow .14s ease; }
  .btn:active { transform: scale(.97); }
  .theme-icon-swap { display: inline-flex; animation: themeRotate .42s cubic-bezier(.34,1.56,.64,1); }
  @keyframes themeRotate {
    from { transform: rotate(-180deg) scale(.4); opacity: 0; }
    to   { transform: rotate(0deg) scale(1); opacity: 1; }
  }
</style>
</head>

// CODIGO FIBRAS — shared data, palette, storage helpers
// ============================================================

// Standard fiber/tube color palette. Each entry: { id, name, hex, ring }
// `ring` is a darker border so light colors (Blanco, Amarillo) stay visible.
window.PALETTE = [
  { id: 'rojo',      name: 'Rojo',      hex: '#FF0000', ring: '#a00000' },
  { id: 'azul',      name: 'Azul',      hex: '#1D6FE0', ring: '#0a3d8a' },
  { id: 'verde',     name: 'Verde',     hex: '#1FA959', ring: '#0d6b35' },
  { id: 'amarillo',  name: 'Amarillo',  hex: '#FFD700', ring: '#a07e00' },
  { id: 'violeta',   name: 'Violeta',   hex: '#7C3AED', ring: '#4a1e9c' },
  { id: 'blanco',    name: 'Blanco',    hex: '#F5F5F5', ring: '#9aa0a6' },
  { id: 'naranja',   name: 'Naranja',   hex: '#FF6A00', ring: '#a83a00' },
  { id: 'gris',      name: 'Gris',      hex: '#7a8693', ring: '#3d464f' },
  { id: 'marron',    name: 'Marrón',    hex: '#7A4A1F', ring: '#3f2710' },
  { id: 'negro',     name: 'Negro',     hex: '#1a1d22', ring: '#000000' },
  { id: 'turquesa',  name: 'Turquesa',  hex: '#26C6DA', ring: '#0e7d8b' },
  { id: 'rosa',      name: 'Rosa',      hex: '#FF6FAF', ring: '#a8366f' },
];

window.colorById = (id) => window.PALETTE.find(c => c.id === id) || window.PALETTE[0];

// ---- Color value helpers ----------------------------------------------------
// A color value can be:
//   'rojo'        — sólido
//   'rojo/azul'   — bicolor (mitad rojo, mitad azul)
//   'rojo:1'      — pica simple (rojo + 1 raya negra)
//   'rojo:2'      — 2 picas (2 rayas negras)
//   'rojo:3'      — 3 picas (3 rayas negras)
window.parseColor = function (val) {
  if (!val) return { kind: 'solid', ids: ['blanco'], picas: 0 };
  const s = String(val);
  if (s.includes(':')) {
    const [base, rest] = s.split(':').map(x => x.trim());
    const n = parseInt(rest);
    if (!isNaN(n) && n >= 1 && n <= 3) {
      return { kind: 'pica', ids: [base || 'blanco'], picas: n };
    }
    // Legacy "rojo:azul" → treat as 1 pica on base (ignore old stripe color)
    return { kind: 'pica', ids: [base || 'blanco'], picas: 1 };
  }
  if (s.includes('/')) {
    const parts = s.split('/').map(x => x.trim()).filter(Boolean);
    return { kind: 'bicolor', ids: parts.slice(0, 2), picas: 0 };
  }
  return { kind: 'solid', ids: [s.trim()], picas: 0 };
};
window.formatColor = function (kind, ids, picas = 1) {
  if (kind === 'bicolor') return `${ids[0]}/${ids[1]}`;
  if (kind === 'pica')    return `${ids[0]}:${Math.max(1, Math.min(3, picas))}`;
  return ids[0];
};
window.colorLabel = function (val) {
  const { kind, ids, picas } = window.parseColor(val);
  const n1 = window.colorById(ids[0]).name;
  if (kind === 'solid')   return n1;
  if (kind === 'bicolor') return `${n1}/${window.colorById(ids[1]).name}`;
  // pica
  return `${n1} ${'/'.repeat(picas)}`;
};
// Generate CSS background for any color value
window.colorBg = function (val, dir = '180deg') {
  const { kind, ids, picas } = window.parseColor(val);
  const c1 = window.colorById(ids[0]).hex;
  if (kind === 'solid') return c1;
  if (kind === 'bicolor') {
    const c2 = window.colorById(ids[1]).hex;
    return `linear-gradient(${dir}, ${c1} 0%, ${c1} 50%, ${c2} 50%, ${c2} 100%)`;
  }
  // pica: N horizontal black stripes on c1 base
  // Use bright contrast for very dark bases (negro)
  const isDarkBase = ids[0] === 'negro';
  const mark = isDarkBase ? '#ffffff' : '#000000';
  // Stripes ~7% tall, evenly spaced
  const stripeW = 7; // %
  if (picas === 1) {
    return `linear-gradient(${dir},
      ${c1} 0%, ${c1} 46%,
      ${mark} 46%, ${mark} ${46+stripeW}%,
      ${c1} ${46+stripeW}%, ${c1} 100%)`;
  }
  if (picas === 2) {
    return `linear-gradient(${dir},
      ${c1} 0%, ${c1} 30%,
      ${mark} 30%, ${mark} ${30+stripeW}%,
      ${c1} ${30+stripeW}%, ${c1} 62%,
      ${mark} 62%, ${mark} ${62+stripeW}%,
      ${c1} ${62+stripeW}%, ${c1} 100%)`;
  }
  // 3 picas
  return `linear-gradient(${dir},
    ${c1} 0%, ${c1} 22%,
    ${mark} 22%, ${mark} ${22+stripeW}%,
    ${c1} ${22+stripeW}%, ${c1} 46%,
    ${mark} 46%, ${mark} ${46+stripeW}%,
    ${c1} ${46+stripeW}%, ${c1} 70%,
    ${mark} 70%, ${mark} ${70+stripeW}%,
    ${c1} ${70+stripeW}%, ${c1} 100%)`;
};
// Resolve free-text like "Rojo", "Rojo/Azul", "Rojo /", "Rojo //", "Rojo ///",
// "Rojo:1", "Rojo 2 picas"
window.parseColorName = function (s) {
  const norm = (x) => String(x).toLowerCase().trim()
    .normalize('NFD').replace(/\p{Diacritic}/gu, '');
  let str = String(s).trim();
  // 1) explicit pica with ':N'
  let m = str.match(/^(.+?)\s*:\s*([123])\s*$/);
  if (m) {
    const base = window.PALETTE.find(c => norm(c.name) === norm(m[1]) || c.id === norm(m[1]));
    if (base) return `${base.id}:${m[2]}`;
  }
  // 2) "Rojo 2 picas" / "rojo 2pica"
  m = str.match(/^(.+?)\s+([123])\s*picas?\s*$/i);
  if (m) {
    const base = window.PALETTE.find(c => norm(c.name) === norm(m[1]) || c.id === norm(m[1]));
    if (base) return `${base.id}:${m[2]}`;
  }
  // 3) "Rojo /", "Rojo //", "Rojo ///"
  m = str.match(/^(.+?)\s*(\/{1,3})\s*$/);
  if (m && !m[1].includes('/')) {
    const base = window.PALETTE.find(c => norm(c.name) === norm(m[1]) || c.id === norm(m[1]));
    if (base) return `${base.id}:${m[2].length}`;
  }
  // 4) Bicolor "Rojo/Azul"
  if (str.includes('/')) {
    const parts = str.split('/').map(p => norm(p));
    const ids = parts.map(np => {
      const f = window.PALETTE.find(c => norm(c.name) === np || c.id === np);
      return f ? f.id : null;
    }).filter(Boolean);
    if (ids.length >= 2) return `${ids[0]}/${ids[1]}`;
    if (ids.length === 1) return ids[0];
    return null;
  }
  // 5) Plain color name
  const np = norm(str);
  const f = window.PALETTE.find(c => norm(c.name) === np || c.id === np);
  return f ? f.id : null;
};

window._bootstrapFromFactoryHTTP = async function () {
  // Only on first run (or if user explicitly resets the boot flag)
  if (localStorage.getItem(window.FACTORY_BOOT_KEY)) return null;
  try {
    // Try several paths so the JSON loads from local file, HTTP server, or root
    const candidates = [
      './assets/factory-backup.json',
      'assets/factory-backup.json',
      './factory-backup.json',
    ];
    let data = null;
    for (const url of candidates) {
      try {
        const r = await fetch(url, { cache: 'no-cache' });
        if (r.ok) { data = await r.json(); break; }
      } catch {}
    }
    if (!data) return null;
    // Apply
    if (Array.isArray(data.cables) && data.cables.length) {
      localStorage.setItem(window.STORAGE_KEY, JSON.stringify(data.cables));
    }
    if (data.reference) {

      localStorage.setItem(window.GALLERY_KEY, JSON.stringify({

let _zipPromise = null;
window.loadJSZip = function () {
  if (window.JSZip) return Promise.resolve(window.JSZip);

  _zipPromise = new Promise((resolve, reject) => {

  });

// Convert dataURL to a Uint8Array (for putting into ZIP)
function _dataUrlToBytes(dataUrl) {
  const m = String(dataUrl).match(/^data:[^;]+;base64,(.+)$/);
  if (!m) return null;
  const bin = atob(m[1]);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// Download a COMPLETE backup: cables + reference + gallery state + ALL photos
// from IndexedDB. Produces a ZIP file.
window.downloadCompleteBackup = async function (cables) {
  const JSZip = await window.loadJSZip();
  const zip = new JSZip();
  const ref = window.loadReference();
  const gal = window.loadGalleryState();
  const photoKeys = await window.photoDB.allKeys();
  // Reduce cables to remove photoIds that no longer exist
  const photosMap = {};
  for (const id of photoKeys) {
    const dataUrl = await window.photoDB.get(id);
    if (!dataUrl) continue;
    photosMap[id] = dataUrl;
  }
  const data = {
    app: 'codigoFibras',
    version: 3,
    exportedAt: new Date().toISOString(),
    isCompleteBackup: true,
    cables, reference: ref,
    galleryCustom: gal.customItems || [],
    galleryOverrides: gal.overrides || {},
    photoIds: Object.keys(photosMap),
  };
  zip.file('data.json', JSON.stringify(data, null, 2));
  const photosFolder = zip.folder('photos');
  for (const [id, dataUrl] of Object.entries(photosMap)) {
    const bytes = _dataUrlToBytes(dataUrl);
    if (!bytes) continue;
    const m = dataUrl.match(/^data:image\/(\w+);/);
    const ext = (m && m[1] === 'png') ? 'png' : 'jpg';
    photosFolder.file(`${id}.${ext}`, bytes);
  }
  const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  a.href = url;
  a.download = `codigo-fibras-completo-${stamp}.zip`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
};

// Restore from a complete ZIP backup. Returns { cables } so caller can setState.
window.restoreCompleteBackup = async function (file) {
  const JSZip = await window.loadJSZip();
  const ab = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(ab);
  const dataFile = zip.file('data.json');
  if (!dataFile) throw new Error('El ZIP no contiene data.json');
  const data = JSON.parse(await dataFile.async('string'));
  if (!data.cables) throw new Error('Datos incompletos');
  // Restore photos to IDB
  const photoFiles = zip.folder('photos');
  if (photoFiles) {
    const filesObj = zip.files;
    for (const path of Object.keys(filesObj)) {
      if (!path.startsWith('photos/') || filesObj[path].dir) continue;
      const m = path.match(/photos\/([^.]+)\.\w+$/);
      if (!m) continue;
      const id = m[1];
      const blob = await filesObj[path].async('blob');
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.readAsDataURL(blob);
      });
      await window.photoDB.put(id, dataUrl);
    }
  }
  if (data.reference) localStorage.setItem(window.REF_KEY, JSON.stringify(data.reference));
  if (data.galleryCustom || data.galleryOverrides) {
    localStorage.setItem(window.GALLERY_KEY, JSON.stringify({
      customItems: data.galleryCustom || [],
      overrides: data.galleryOverrides || {},
    }));
  }
  return data.cables;
};

// Stores photo dataUrl by id. Used by cable photos and user-added gallery items.
const _IDB_NAME = 'codigoFibras';
const _IDB_VER = 1;
let _idbPromise = null;
function _openIDB() {
  if (_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(_IDB_NAME, _IDB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _idbPromise;
}
window.photoDB = {
  async put(id, dataUrl) {
    const db = await _openIDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').put(dataUrl, id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async get(id) {
    const db = await _openIDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readonly');
      const r = tx.objectStore('photos').get(id);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => rej(r.error);
    });
  },
  async delete(id) {
    const db = await _openIDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readwrite');
      tx.objectStore('photos').delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  },
  async allKeys() {
    const db = await _openIDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('photos', 'readonly');
      const r = tx.objectStore('photos').getAllKeys();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  },
};

// ---- Fuzzy match: lowercase, accent-insensitive, substring or token-wise -----
window.fuzzyMatch = function (needle, haystacks) {
  const norm = (s) => String(s || '').toLowerCase()
    .normalize('NFD').replace(/\p{Diacritic}/gu, '');
  const n = norm(needle).trim();
  if (!n) return true;
  const tokens = n.split(/\s+/).filter(Boolean);
  const hay = haystacks.map(norm).join(' ');
  return tokens.every(t => hay.includes(t));
};
window.resizePhotoFile = function (file, { maxDim = 1600, quality = 0.85, mime = 'image/jpeg' } = {}) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Imagen inválida'));
      img.onload = () => {
        let { width: w, height: h } = img;
        if (Math.max(w, h) > maxDim) {
          const k = maxDim / Math.max(w, h);
          w = Math.round(w * k);
          h = Math.round(h * k);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL(mime, quality);
        resolve({ dataUrl, width: w, height: h, bytes: Math.round(dataUrl.length * 0.75) });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
};
window.fmtBytes = function (n) {
  if (n < 1024) return n + ' B';
  if (n < 1024*1024) return (n/1024).toFixed(1) + ' KB';

};

// Header normalization for tolerant matching
const _normHdr = (s) => String(s || '').toLowerCase().trim()
  .normalize('NFD').replace(/\p{Diacritic}/gu, '')
  .replace(/\s+/g, ' ');

const HEADER_MAP = {
  nombre: 'name', name: 'name', cable: 'name',
  operadora: 'operator', operador: 'operator', operator: 'operator',
  tubos: 'tubeCount', tubes: 'tubeCount',
  fibras: 'fiberCount', fibras_por_tubo: 'fiberCount', 'fibras por tubo': 'fiberCount', fibers: 'fiberCount',
  'secuencia tubos': 'tubeSeq', 'tubos secuencia': 'tubeSeq', 'tube sequence': 'tubeSeq', tubos_seq: 'tubeSeq',
  'secuencia fibras': 'fiberSeq', 'fibras secuencia': 'fiberSeq', 'fiber sequence': 'fiberSeq', fibras_seq: 'fiberSeq',
  notas: 'notes', notes: 'notes', nota: 'notes',
};

window.importCablesFromExcel = async function (file) {
  const XLSX = await window.loadXLSX();
  const ab = await file.arrayBuffer();
  const wb = XLSX.read(ab, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
  if (rows.length === 0) throw new Error('La hoja está vacía');

  // Map headers (case/accent insensitive)
  const sample = rows[0];
  const keyMap = {}; // sheetKey -> normalizedField
  for (const k of Object.keys(sample)) {
    const target = HEADER_MAP[_normHdr(k)];
    if (target) keyMap[k] = target;
  }
  const needed = ['name','tubeSeq','fiberSeq'];
  const has = Object.values(keyMap);
  for (const n of needed) {
    if (!has.includes(n)) {
      throw new Error(`Falta la columna "${n === 'name' ? 'Nombre' : n === 'tubeSeq' ? 'Secuencia Tubos' : 'Secuencia Fibras'}"`);
    }
  }

  const cables = [];
  rows.forEach((row, i) => {
    const r = {};
    for (const [k, field] of Object.entries(keyMap)) r[field] = row[k];
    if (!r.name || !String(r.name).trim()) return;

    const tubeSeq = String(r.tubeSeq || '').split(/[,\n;]/).map(s => s.trim()).filter(Boolean);
    const fiberSeq = String(r.fiberSeq || '').split(/[,\n;]/).map(s => s.trim()).filter(Boolean);
    const tubeIds  = tubeSeq.map(s => window.parseColorName(s)).filter(Boolean);
    const fiberIds = fiberSeq.map(s => window.parseColorName(s)).filter(Boolean);
    if (tubeIds.length === 0 || fiberIds.length === 0) {
      throw new Error(`Fila ${i+2}: secuencia de tubos o fibras inválida`);
    }
    const tCount = parseInt(r.tubeCount) || tubeIds.length;
    const fCount = parseInt(r.fiberCount) || fiberIds.length;
    const tubes = [];
    for (let t = 0; t < tCount; t++) {
      const fibers = [];
      for (let f = 0; f < fCount; f++) fibers.push(fiberIds[f % fiberIds.length]);
      tubes.push({ colorId: tubeIds[t % tubeIds.length], fibers });
    }
    cables.push({
      id: window.uid(),
      name: String(r.name).trim(),
      operator: String(r.operator || '').trim(),
      notes: String(r.notes || '').trim(),
      tubes,
    });
  });

  if (cables.length === 0) throw new Error('No se importó ningún cable. ¿La hoja tiene la columna "Nombre"?');
  return cables;
};

  XLSX.writeFile(wb, `codigo-fibras-${stamp}.xlsx`);
};

window.downloadExcelTemplate = async function () {
  const XLSX = await window.loadXLSX();
  const sample = [
    {
      Nombre: '64 F.O. — 8 tubos × 8 fibras',
      Operadora: 'R CABLE',
      Tubos: 8,
      Fibras: 8,
      'Secuencia Tubos': 'Blanco, Blanco, Rojo, Rojo, Azul, Azul, Verde, Verde',
      'Secuencia Fibras': 'Rojo, Azul, Verde, Amarillo, Violeta, Blanco, Naranja, Gris',
      Notas: 'Pares por color',
    },
    {
      Nombre: 'Ejemplo bicolor',
      Operadora: 'DEMO',
      Tubos: 4,
      Fibras: 4,
      'Secuencia Tubos': 'Blanco, Rojo, Azul/Blanco, Verde/Blanco',
      'Secuencia Fibras': 'Rojo, Azul, Verde, Amarillo',
      Notas: 'Usa "/" para bicolor',
    },
  ];
  const ws = XLSX.utils.json_to_sheet(sample);
  ws['!cols'] = [{wch:30},{wch:14},{wch:7},{wch:7},{wch:55},{wch:55},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Cables');
  XLSX.writeFile(wb, 'codigo-fibras-plantilla.xlsx');
};

// Find fiber by absolute number (1-based). Returns raw color values; caller renders them.
window.findFiberByNumber = function (cable, n) {
  let count = 0;
  for (let ti = 0; ti < cable.tubes.length; ti++) {
    const t = cable.tubes[ti];
    if (n > count && n <= count + t.fibers.length) {
      const fi = n - count - 1;
      return {
        tubeIdx: ti,
        fiberIdx: fi,
        tubeColor: t.colorId,
        fiberColor: t.fibers[fi],
        tubeLabel: window.colorLabel(t.colorId),
        fiberLabel: window.colorLabel(t.fibers[fi]),
        tubeNote: t.label || '',
      };
    }
    count += t.fibers.length;
  }
  return null;
};

function useToast() {
  const [msg, setMsg] = useState('');
  const t = useRef(null);
  const show = useCallback((m) => {
    setMsg(m);
    clearTimeout(t.current);
    t.current = setTimeout(() => setMsg(''), 2200);
  }, []);
  return [show, msg ? <div className="toast">{msg}</div> : null];
}

function Swatch({ color, size = 22, round = true, border = true }) {

}

function Photo({ photoId, dataUrl, src, alt, className, style, onClick }) {
  const [s, setS] = useState(src || dataUrl || null);
  useEffect(() => {
    if (src) { setS(src); return; }
    if (dataUrl) { setS(dataUrl); return; }
    if (!photoId) { setS(null); return; }
    let alive = true;
    window.photoDB.get(photoId).then(d => { if (alive) setS(d); });
    return () => { alive = false; };
  }, [photoId, dataUrl, src]);
  if (!s) return <div className={className} style={{...style, background: 'var(--bg-soft)'}} />;
  return <img src={s} alt={alt || ''} className={className} style={style} onClick={onClick} loading="lazy" />;
}

// ---------- Color picker (solid / bicolor / pica) ----------
function ColorPicker({ value, onChange, allowPica = true }) {
  const parsed = window.parseColor(value);
  const [kind, setKind] = useState(parsed.kind);
  const [c1, setC1] = useState(parsed.ids[0]);
  const [c2, setC2] = useState(parsed.ids[1] || 'azul');
  const [picas, setPicas] = useState(parsed.picas || 1);
  const [textInput, setTextInput] = useState(window.colorLabel(value));
  const [textInvalid, setTextInvalid] = useState(false);

  const lastEmitRef = useRef(value);
  useEffect(() => {
    const newVal = window.formatColor(kind, [c1, c2], picas);
    if (newVal === lastEmitRef.current) return;
    lastEmitRef.current = newVal;
    onChange(newVal);
    setTextInput(window.colorLabel(newVal));
    setTextInvalid(false);
  }, [kind, c1, c2, picas]);

  const onText = (t) => {
    setTextInput(t);
    const parsedVal = window.parseColorName(t);
    if (!parsedVal) { setTextInvalid(true); return; }
    setTextInvalid(false);
    const p = window.parseColor(parsedVal);
    lastEmitRef.current = parsedVal;
    setKind(p.kind);
    setC1(p.ids[0]);
    if (p.ids[1]) setC2(p.ids[1]);
    if (p.picas) setPicas(p.picas);
    onChange(parsedVal);
  };

  const current = window.formatColor(kind, [c1, c2], picas);

  return (
    <div style={{display: 'flex', flexDirection: 'column', gap: 12}}>
      <div style={{display: 'flex', alignItems: 'center', gap: 10}}>
        <div style={{
          width: 44, height: 44, borderRadius: 10,
          background: window.colorBg(current),
          boxShadow: 'inset 0 0 0 1.5px rgba(0,0,0,.2)',
          flexShrink: 0,
        }} />
        <input
          className={`color-name-input ${textInvalid ? 'invalid' : ''}`}
          value={textInput}
          onChange={(e) => onText(e.target.value)}
          placeholder='Ej. "Rojo", "Rojo/Azul", "Rojo /"'
        />
      </div>

      <div className="pat-tabs">
        <button type="button" className={`pat-tab ${kind === 'solid' ? 'active' : ''}`}
                onClick={() => setKind('solid')}>
          <span className="pat-preview" style={{ background: window.colorBg(c1) }} />
          Sólido
        </button>
        <button type="button" className={`pat-tab ${kind === 'bicolor' ? 'active' : ''}`}
                onClick={() => setKind('bicolor')}>
          <span className="pat-preview" style={{ background: window.colorBg(`${c1}/${c2}`) }} />
          Bicolor
        </button>
        {allowPica && (
          <button type="button" className={`pat-tab ${kind === 'pica' ? 'active' : ''}`}
                  onClick={() => setKind('pica')}>
            <span className="pat-preview" style={{ background: window.colorBg(`${c1}:${picas}`) }} />
            Picas
          </button>
        )}
      </div>

      {/* Pica count selector */}
      {kind === 'pica' && (
        <div>
          <div style={{fontSize: 11, color: 'var(--ink-3)', marginBottom: 6, textTransform: 'uppercase', letterSpacing: '.08em', fontWeight: 600}}>
            Número de picas
          </div>
          <div className="pat-tabs">
            {[1, 2, 3].map(n => (

        </div>

            <button key={c.id} type="button"

            {window.PALETTE.map(c => (
              <button key={c.id} type="button"
                      className={`color-cell ${c2 === c.id ? 'selected' : ''}`}

// ---------- Cable editor modal ----------
function CableEditor({ cable, allOperators, onCancel, onSave }) {
  const [draft, setDraft] = useState(() => JSON.parse(JSON.stringify(cable)));
  const [picking, setPicking] = useState(null); // { kind: 'tube'|'fiber', idx, value }

  const update = (patch) => setDraft(d => ({ ...d, ...patch }));

  const setTubeCount = (n) => {
    n = Math.max(1, Math.min(64, parseInt(n) || 1));
    setDraft(d => {
      const tubes = [...d.tubes];
      const fcount = tubes[0]?.fibers.length || 8;
      const defaultColors = ['blanco','rojo','azul','verde','amarillo','violeta','naranja','gris','marron','negro','turquesa','rosa'];
      const seq = ['rojo','azul','verde','amarillo','violeta','blanco','naranja','gris','marron','negro','turquesa','rosa'].slice(0, fcount);
      while (tubes.length < n) {
        tubes.push({ colorId: defaultColors[tubes.length % defaultColors.length], fibers: [...seq] });
      }
      while (tubes.length > n) tubes.pop();
      return { ...d, tubes };
    });
  };
  const setFiberCount = (n) => {
    n = Math.max(1, Math.min(64, parseInt(n) || 1));
    setDraft(d => {
      const seq = ['rojo','azul','verde','amarillo','violeta','blanco','naranja','gris','marron','negro','turquesa','rosa'];
      const tubes = d.tubes.map(t => {
        const fibers = [...t.fibers];
        while (fibers.length < n) fibers.push(seq[fibers.length % seq.length]);
        while (fibers.length > n) fibers.pop();
        return { ...t, fibers };
      });
      return { ...d, tubes };
    });
  };

  const setTubeColor = (i, val, lbl) => {
    setDraft(d => ({ ...d, tubes: d.tubes.map((t, ti) => ti === i ? { ...t, colorId: val, ...(lbl !== undefined ? { label: lbl } : {}) } : t) }));
  };
  const setFiberColor = (i, val) => {
    setDraft(d => {
      // Apply to fiber position `i` of every tube (it's a uniform sequence)
      const tubes = d.tubes.map(t => {
        const fibers = [...t.fibers];
        if (i < fibers.length) fibers[i] = val;
        return { ...t, fibers };
      });
      return { ...d, tubes };
    });
  };

  const fibersPerTube = draft.tubes[0]?.fibers.length || 8;
  const fiberSeq = draft.tubes[0]?.fibers || [];

  return (
    <div className="modal-back" onClick={(e) => e.target === e.currentTarget && onCancel()}>
      <div className="modal" style={{ maxWidth: 620 }}>
        <div className="modal-head">
          <h3>{cable._isNew ? 'Nuevo cable' : 'Editar cable'}</h3>
          <button className="btn btn-icon btn-ghost" onClick={onCancel}><IconClose /></button>
        </div>
        <div className="modal-body">
          <div className="field">
            <label>Nombre del cable</label>
            <input className="input" value={draft.name} onChange={(e) => update({ name: e.target.value })} />
          </div>
          <div className="field-row">
            <div className="field">
              <label>Operadora</label>
              <input className="input" list="op-list" value={draft.operator || ''}
                     onChange={(e) => update({ operator: e.target.value })}
                     placeholder="R CABLE, Movistar…" />
              <datalist id="op-list">
                {allOperators.map(op => <option key={op} value={op === window.NO_OPERATOR ? '' : op} />)}
              </datalist>
            </div>
            <div className="field">
              <label>Tipo</label>
              <input className="input" value={draft.type || ''} onChange={(e) => update({ type: e.target.value })} placeholder="Troncal, acometida…" />
            </div>
          </div>
          <div className="field-row">
            <div className="field">
              <label>Tubos</label>
              <input className="input mono" type="number" min="1" max="64" value={draft.tubes.length}
                     onChange={(e) => setTubeCount(e.target.value)} />
            </div>
            <div className="field">
              <label>Fibras por tubo</label>
              <input className="input mono" type="number" min="1" max="64" value={fibersPerTube}
                     onChange={(e) => setFiberCount(e.target.value)} />
            </div>
          </div>

          <div className="field">
            <label>Secuencia de tubos · clic para editar</label>
            <SequenceChips
              items={draft.tubes}
              getColor={(t) => t.colorId}
              baseLabel="T"
              getSubtle={(i) => {
                const base = draft.tubes.slice(0, i).reduce((s, t) => s + t.fibers.length, 0);
                return `${base + 1}–${base + draft.tubes[i].fibers.length}`;
              }}
              onEdit={(i) => setPicking({ kind: 'tube', idx: i, value: draft.tubes[i].colorId })}
            />
          </div>

          <div className="field">
            <label>Secuencia de fibras · clic para editar</label>
            <SequenceChips
              items={fiberSeq}
              getColor={(v) => v}
              baseLabel="F"
              onEdit={(i) => setPicking({ kind: 'fiber', idx: i, value: fiberSeq[i] })}
            />
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onCancel}>Cancelar</button>
          <button className="btn btn-primary" onClick={() => onSave(draft)}>
            <IconCheck /> Guardar
          </button>
        </div>
      </div>

      {picking && (
        <ColorPickerModal
          title={picking.kind === 'tube' ? `Tubo ${picking.idx + 1}` : `Fibra posición ${picking.idx + 1}`}
          value={picking.value}
          askLabel={picking.kind === 'tube'}
          label={picking.kind === 'tube' ? (draft.tubes[picking.idx].label || '') : ''}
          onCancel={() => setPicking(null)}
          onSave={(v, lbl) => {
            if (picking.kind === 'tube') setTubeColor(picking.idx, v, lbl);
            else setFiberColor(picking.idx, v);
            setPicking(null);
          }}
        />
      )}
    </div>
  );
}

// ---------- Info / Notes tab ----------
function InfoTab({ cable, onUpdate, toast, locked }) {
  const [lightboxIdx, setLightboxIdx] = useState(null);
  const [maxDim, setMaxDim] = useState(1600);
  const [quality, setQuality] = useState(0.85);
  const fileRef = useRef(null);
  const photos = cable.photos || [];
  const notes = cable.notes || '';

  const totalBytes = photos.reduce((s, p) => s + (p.bytes || 0), 0);

  const onPickFiles = async (files) => {
    if (locked) { toast('Desbloquea el candado para añadir fotos'); return; }
    const added = [];
    for (const f of Array.from(files)) {
      try {
        const r = await window.resizePhotoFile(f, { maxDim, quality });
        const photoId = await window.addPhotoToIDB(r.dataUrl);
        added.push({
          id: window.uid(), photoId,
          caption: '', width: r.width, height: r.height, bytes: r.bytes,
          createdAt: new Date().toISOString(),
        });
      } catch (e) {
        toast('Error con ' + f.name);
      }
    }
    if (added.length) {
      onUpdate({ photos: [...photos, ...added] });
      toast(`${added.length} foto(s) añadida(s)`);
    }
  };

  const delPhoto = async (id) => {
    if (locked) { toast('Desbloquea el candado para borrar'); return; }
    if (!confirm('¿Borrar esta foto?')) return;
    const p = photos.find(x => x.id === id);
    if (p?.photoId) await window.photoDB.delete(p.photoId).catch(()=>{});
    onUpdate({ photos: photos.filter(p => p.id !== id) });
    setLightboxIdx(null);
    toast('Foto borrada');
  };
  const updCaption = (id, caption) => {
    if (locked) return;
    onUpdate({ photos: photos.map(p => p.id === id ? { ...p, caption } : p) });
  };

  return (
    <div className="info-section">
      <div>
        <h2 style={{marginBottom: 8}}>Notas</h2>
        <textarea
          className="notes-area"
          value={notes}
          readOnly={locked}
          onChange={(e) => onUpdate({ notes: e.target.value })}
          placeholder={locked ? 'Desbloquea el candado para editar' : 'Apunta aquí lo que necesites recordar: ubicación, empalmes, pérdidas, observaciones, etc.'}
        />
      </div>

      <div>
        <h2 style={{marginBottom: 8, display:'flex', alignItems:'center', gap: 10}}>
          Fotos
          <span className="mono" style={{fontSize: 12, color: 'var(--ink-3)', fontWeight: 400}}>
            {photos.length} · {window.fmtBytes(totalBytes)}
          </span>
        </h2>

        {!locked && (
          <div className="upload-opts">
            <div className="field">
              <label>Tamaño máximo</label>
              <select className="select" value={maxDim} onChange={(e) => setMaxDim(parseInt(e.target.value))}>
                <option value="800">Pequeña (800 px) · ocupa menos</option>
                <option value="1600">Media (1600 px) · recomendado</option>
                <option value="2400">Grande (2400 px)</option>
                <option value="4096">Original (sin reducir)</option>
              </select>
            </div>
            <div className="field">
              <label>Calidad ({Math.round(quality * 100)}%)</label>
              <input type="range" min="0.5" max="1" step="0.05" value={quality}
                     onChange={(e) => setQuality(parseFloat(e.target.value))} />
            </div>
          </div>
        )}

        <div className="photo-grid">
          {!locked && (
            <button className="photo-add" onClick={() => fileRef.current.click()}>
              <div>
                <IconCamera />
                <div style={{marginTop: 8, fontWeight: 500}}>Añadir fotos</div>
                <div style={{fontSize: 11, marginTop: 2}}>JPG, PNG, HEIC…</div>
              </div>
            </button>
          )}
          {photos.map((p, i) => (
            <div key={p.id} className="photo-card" onClick={() => setLightboxIdx(i)}>
              <Photo photoId={p.photoId} dataUrl={p.dataUrl} alt={p.caption || ''} />
              <div className="photo-meta">{p.width}×{p.height} · {window.fmtBytes(p.bytes || 0)}</div>
              {!locked && (
                <button className="ph-del" onClick={(e) => { e.stopPropagation(); delPhoto(p.id); }} title="Borrar"><IconTrash /></button>
              )}
              <div className="caption" onClick={(e) => e.stopPropagation()}>
                <input value={p.caption} readOnly={locked}
                       onChange={(e) => updCaption(p.id, e.target.value)}
                       placeholder={locked ? '' : 'Descripción…'} />
              </div>
            </div>
          ))}
        </div>

        <input ref={fileRef} type="file" accept="image/*" multiple style={{display: 'none'}}
               onChange={(e) => { onPickFiles(e.target.files); e.target.value = ''; }} />
      </div>

      {lightboxIdx !== null && photos[lightboxIdx] && (
        <div className="lightbox" onClick={() => setLightboxIdx(null)}>
          <Photo photoId={photos[lightboxIdx].photoId} dataUrl={photos[lightboxIdx].dataUrl}
                 alt={photos[lightboxIdx].caption || ''} />
        </div>
      )}
    </div>
  );
}

function GalleryView({ locked, toast }) {
  const [state, setState] = useState(() => window.loadGalleryState());
  const [search, setSearch] = useState('');
  const [activeCat, setActiveCat] = useState('all');
  const [lightboxId, setLightboxId] = useState(null);
  const fileRef = useRef(null);
  useEffect(() => { window.saveGalleryState(state); }, [state]);

  const composed = window.composeGallery(state);
  const visible = composed.filter(g => !g.hidden);

  const cats = useMemo(() => {
    const map = new Map();
    visible.forEach(g => map.set(g.category, (map.get(g.category) || 0) + 1));
    return Array.from(map.entries()).sort((a, b) => b[1] - a[1]);
  }, [visible]);

  const filtered = visible.filter(g =>
    (activeCat === 'all' || g.category === activeCat) &&
    window.fuzzyMatch(search, [g.name, g.category])
  );

  const onFiles = async (files) => {
    if (locked) { toast('Desbloquea el candado'); return; }
    const newCustoms = [];
    for (const f of Array.from(files)) {
      try {
        const r = await window.resizePhotoFile(f, { maxDim: 1200, quality: 0.78 });
        const photoId = await window.addPhotoToIDB(r.dataUrl);
        // Save a thumb inline (small) for the grid view
        newCustoms.push({
          id: 'gal-c-' + Math.random().toString(36).slice(2, 8),
          name: f.name.replace(/\.[^.]+$/, ''),
          category: 'Mis fotos',
          photoId,
          w: r.width, h: r.height, bytes: r.bytes,
        });
      } catch { toast('Error con ' + f.name); }
    }
    if (newCustoms.length) {
      setState(s => ({ ...s, customItems: [...(s.customItems || []), ...newCustoms] }));
      toast(`${newCustoms.length} foto(s) añadida(s)`);
    }
  };

  const updItem = (id, patch) => {
    if (locked) return;
    setState(s => {
      // Custom item?
      const isCustom = s.customItems?.some(c => c.id === id);
      if (isCustom) {
        return { ...s, customItems: s.customItems.map(c => c.id === id ? { ...c, ...patch } : c) };
      }
      // Default item → store override
      return { ...s, overrides: { ...s.overrides, [id]: { ...(s.overrides[id] || {}), ...patch } } };
    });
  };

  const hideOrDelete = async (item) => {
    if (locked) { toast('Desbloquea el candado'); return; }
    if (item.isDefault) {
      if (!confirm(`¿Ocultar "${item.name}" de la galería?`)) return;
      updItem(item.id, { hidden: true });
      toast('Foto ocultada');
    } else {
      if (!confirm(`¿Borrar "${item.name}"?`)) return;
      if (item.photoId) await window.photoDB.delete(item.photoId).catch(()=>{});
      setState(s => ({ ...s, customItems: s.customItems.filter(c => c.id !== item.id) }));
      toast('Foto borrada');
    }
    setLightboxId(null);
  };

  const restoreHidden = () => {
    if (locked) { toast('Desbloquea el candado'); return; }
    setState(s => ({ ...s, overrides: Object.fromEntries(
      Object.entries(s.overrides).map(([k, v]) => [k, { ...v, hidden: false }])
    )}));
    toast('Fotos restauradas');
  };

  const current = lightboxId ? composed.find(g => g.id === lightboxId) : null;
  const hiddenCount = Object.values(state.overrides || {}).filter(o => o?.hidden).length;

  return (
    <div className="gal-section">
      <h1>Galería CTOs · {visible.length} fotos</h1>
      <div className="gal-toolbar">
        <input className="gal-search" value={search}
               placeholder="Buscar por nombre o categoría…"
               onChange={(e) => setSearch(e.target.value)} />
        {!locked && (
          <button className="btn" onClick={() => fileRef.current.click()}>
            <IconPlus /> Añadir
          </button>
        )}
      </div>

      <div className="gal-cats">
        <button className={`gal-cat ${activeCat === 'all' ? 'active' : ''}`} onClick={() => setActiveCat('all')}>
          Todas <span className="n">{visible.length}</span>
        </button>
        {cats.map(([c, n]) => (
          <button key={c} className={`gal-cat ${activeCat === c ? 'active' : ''}`} onClick={() => setActiveCat(c)}>
            {c} <span className="n">{n}</span>
          </button>
        ))}
      </div>

      <div className="gal-grid">
        {filtered.map(item => (
          <div key={item.id} className="gal-item" onClick={() => setLightboxId(item.id)}>
            <Photo photoId={item.isDefault ? null : item.photoId}
                   src={item.isDefault ? item.src : null}
                   alt={item.name} />
            <div className="gal-cap">
              {item.name}
              <div className="gal-meta">{item.category}</div>
            </div>
            {!locked && (
              <button className="gal-del" onClick={(e) => { e.stopPropagation(); hideOrDelete(item); }}>
                {item.isDefault ? <IconClose /> : <IconTrash />}
              </button>
            )}
          </div>
        ))}
      </div>

      {hiddenCount > 0 && !locked && (
        <div style={{marginTop: 18, color: 'var(--ink-3)', fontSize: 13}}>
          {hiddenCount} foto(s) oculta(s) ·
          <button className="btn btn-ghost btn-sm" onClick={restoreHidden} style={{marginLeft: 8}}>
            Restaurar
          </button>
        </div>
      )}

      <input ref={fileRef} type="file" accept="image/*" multiple style={{display: 'none'}}
             onChange={(e) => { onFiles(e.target.files); e.target.value = ''; }} />

      {current && (
        <div className="lightbox" onClick={() => setLightboxId(null)}
             style={{position:'fixed', inset: 0, background: 'rgba(0,0,0,.92)', zIndex: 100,
                     display: 'grid', placeItems: 'center', padding: 24, cursor: 'pointer'}}>
          <div style={{maxWidth: '92vw', maxHeight: '88vh', display:'flex', flexDirection:'column', gap: 12}}
               onClick={(e) => e.stopPropagation()}>
            <Photo photoId={current.isDefault ? null : current.photoId}
                   src={current.isDefault ? current.src : null}
                   style={{maxWidth: '92vw', maxHeight: '70vh', objectFit: 'contain', borderRadius: 8, background:'#000'}} />
            <div style={{color: 'white', textAlign: 'center'}}>
              {locked
                ? <div style={{fontSize: 15}}><b>{current.name}</b> · {current.category}</div>
                : <>
                  <input className="input" defaultValue={current.name}
                         onBlur={(e) => updItem(current.id, { name: e.target.value })}
                         style={{textAlign:'center', background:'rgba(255,255,255,.1)', color:'white', borderColor:'rgba(255,255,255,.2)'}} />
                  <input className="input" defaultValue={current.category}
                         onBlur={(e) => updItem(current.id, { category: e.target.value })}
                         style={{textAlign:'center', marginTop: 8, background:'rgba(255,255,255,.1)', color:'white', borderColor:'rgba(255,255,255,.2)'}} />
                </>
              }
            </div>
          </div>
          <button className="btn btn-icon" onClick={() => setLightboxId(null)}
                  style={{position: 'absolute', top: 16, right: 16, background: 'rgba(255,255,255,.15)', color:'white', borderColor:'transparent'}}>
            <IconClose />
          </button>
        </div>
      )}
    </div>
  );
}
