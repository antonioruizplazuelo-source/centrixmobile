// ---------- Mobile picker: operator dropdown + horizontal cable list ----------
function MobilePicker({ cables, selectedId, onSelect }) {
  // Group cables by operator
  const groups = useMemo(() => {
    const map = new Map();
    cables.forEach(c => {
      const op = (c.operator || '').trim() || window.NO_OPERATOR;
      if (!map.has(op)) map.set(op, []);
      map.get(op).push(c);
    });
    for (const list of map.values()) {
      list.sort((a, b) => window.totalFibers(b) - window.totalFibers(a) || a.name.localeCompare(b.name, 'es'));
    }
    return Array.from(map.entries()).sort(([a], [b]) => {
      if (a === window.NO_OPERATOR) return 1;
      if (b === window.NO_OPERATOR) return -1;
      return a.localeCompare(b, 'es');
    });
  }, [cables]);
  const selectedCable = cables.find(c => c.id === selectedId);
  const currentOp = (selectedCable?.operator || '').trim() || window.NO_OPERATOR;
  const [op, setOp] = useState(currentOp);
  useEffect(() => { setOp(currentOp); }, [currentOp]);
  const opCables = (groups.find(([k]) => k === op) || [, []])[1];

  return (
    <div className="mobile-picker">
      <div className="mobile-picker-bar">
        <select value={op} onChange={(e) => setOp(e.target.value)}>
          {groups.map(([k, list]) => (
            <option key={k} value={k}>{k} ({list.length})</option>
          ))}
        </select>
      </div>
      <div className="mobile-picker-cables">
        {opCables.map(c => (
          <button key={c.id} className={`cli-mobile ${c.id === selectedId ? 'active' : ''}`}
                  onClick={() => onSelect(c.id)}>
            {c.name.split('—')[0].trim()}
          </button>
        ))}
      </div>
    </div>
  );
}

// ---------- Main App ----------
function App() {
  const [cables, setCables] = useState(() => window.loadCables());
  const [bootDone, setBootDone] = useState(false);
  const [canInstall, setCanInstall] = useState(false);
  const [selectedId, setSelectedId] = useState(() => cables[0]?.id);
  const [theme, setTheme] = useState(() => localStorage.getItem(window.THEME_KEY) || 'light');
  const [tab, setTab] = useState('cable');
  const [view, setView] = useState('cables'); // cables | reference | gallery | help
  const [locked, setLocked] = useState(() => window.isLocked());
  const [editorCable, setEditorCable] = useState(null);
  const [picker, setPicker] = useState(null);
  const [search, setSearch] = useState('');
  const [sidebarSearch, setSidebarSearch] = useState('');
  const [highlight, setHighlight] = useState(null);
  const [collapsedOps, setCollapsedOps] = useState(() => {
    // Collapse all operator groups by default
    const initial = {};
    const list = window.loadCables();
    list.forEach(c => {
      const op = (c.operator || '').trim() || window.NO_OPERATOR;
      initial[op] = true;
    });
    return initial;
  });
  const [movingCable, setMovingCable] = useState(null);
  const [opMenu, setOpMenu] = useState(null);
  const [cableMenu, setCableMenu] = useState(null);
  const [showWelcome, setShowWelcome] = useState(() => !localStorage.getItem('codigoFibras.welcome.dismissed'));
  const [toast, toastView] = useToast();

  // Migrate old in-place photos to IDB on first load (one-shot)
  useEffect(() => {
    (async () => {
      // Try factory boot only on first run
      const factory = await window.bootstrapFromFactory();
      if (factory) {
        if (Array.isArray(factory.cables)) setCables(factory.cables);
      }
      const changed = await window.migrateOldPhotos(cables);
      if (changed) setCables([...cables]);
      setBootDone(true);
    })();
    // Listen to install prompt
    const onCan = () => setCanInstall(true);
    const onInst = () => setCanInstall(false);
    window.addEventListener('canInstallApp', onCan);
    window.addEventListener('appInstalled', onInst);
    if (window.__deferredInstall) setCanInstall(true);
    return () => {
      window.removeEventListener('canInstallApp', onCan);
      window.removeEventListener('appInstalled', onInst);
    };
    // eslint-disable-next-line
  }, []);

  const installApp = async () => {
    if (!window.__deferredInstall) return;
    window.__deferredInstall.prompt();
    await window.__deferredInstall.userChoice;
    window.__deferredInstall = null;
    setCanInstall(false);
  };

  useEffect(() => { window.saveCables(cables); }, [cables]);
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(window.THEME_KEY, theme);
  }, [theme]);
  useEffect(() => { window.setLocked(locked); }, [locked]);
  useEffect(() => {
    if (!cables.find(c => c.id === selectedId)) setSelectedId(cables[0]?.id);
  }, [cables, selectedId]);

  // close menus on outside click
  useEffect(() => {
    const close = () => { setOpMenu(null); setCableMenu(null); };
    window.addEventListener('click', close);
    return () => window.removeEventListener('click', close);
  }, []);

  const selected = cables.find(c => c.id === selectedId);

  // Guard mutation actions when locked
  const ifUnlocked = (fn, msg = 'Desbloquea el candado primero') => (...args) => {
    if (locked) { toast(msg); return; }
    return fn(...args);
  };

  const grouped = useMemo(() => {
    const map = new Map();
    cables.forEach(c => {
      const op = (c.operator || '').trim() || window.NO_OPERATOR;
      if (!map.has(op)) map.set(op, []);
      map.get(op).push(c);
    });
    // Sort cables within each operator: by descending total fibers, then by name
    for (const list of map.values()) {
      list.sort((a, b) => {
        const fa = window.totalFibers(a), fb = window.totalFibers(b);
        if (fa !== fb) return fb - fa;
        return a.name.localeCompare(b.name, 'es');
      });
    }
    // Filter by fuzzy search
    let arr = Array.from(map.entries());
    if (sidebarSearch.trim()) {
      arr = arr.map(([op, list]) => [
        op,
        list.filter(c => window.fuzzyMatch(sidebarSearch, [c.name, c.type, c.operator, op]))
      ]).filter(([, list]) => list.length > 0);
    }
    return arr.sort(([a], [b]) => {
      if (a === window.NO_OPERATOR) return 1;
      if (b === window.NO_OPERATOR) return -1;
      return a.localeCompare(b, 'es');
    });
  }, [cables, sidebarSearch]);

  const allOperators = useMemo(() => window.listOperators(cables), [cables]);

  // Fiber lookup
  const lookup = useMemo(() => {
    if (!selected) return null;
    const n = parseInt(search);
    if (!n || isNaN(n)) return null;
    return window.findFiberByNumber(selected, n);
  }, [search, selected]);
  useEffect(() => {
    if (lookup) { setHighlight({ tubeIdx: lookup.tubeIdx, fiberIdx: lookup.fiberIdx }); setTab('cable'); }
    else if (!search) setHighlight(null);
  }, [lookup, search]);

  // ---- handlers ----
  const _updateCable = (id, patch) => {
    setCables(cs => cs.map(c => c.id === id ? { ...c, ...patch } : c));
  };
  const updateCable = ifUnlocked(_updateCable);
  const updateCableAlways = _updateCable; // for migration etc.
  const updateSelected = (patch) => selected && updateCable(selected.id, patch);
  // Notes/photos updates allowed even when locked? No — info tab respects locked too.
  const updateSelectedAlways = (patch) => selected && _updateCable(selected.id, patch);

  const saveCable = ifUnlocked((draft) => {
    if (draft._isNew) {
      const newC = { ...draft, id: window.uid() };
      delete newC._isNew;
      setCables([...cables, newC]);
      setSelectedId(newC.id);
      toast('Cable creado');
    } else {
      setCables(cables.map(c => c.id === draft.id ? draft : c));
      toast('Cable guardado');
    }
    setEditorCable(null);
  });

  const deleteCable = ifUnlocked((id) => {
    const c = cables.find(x => x.id === id); if (!c) return;
    if (!confirm(`¿Borrar "${c.name}"?`)) return;
    setCables(cables.filter(x => x.id !== id));
    toast('Cable borrado');
  });
  const duplicateCable = ifUnlocked((id, opOverride) => {
    const c = cables.find(x => x.id === id); if (!c) return;
    const copy = JSON.parse(JSON.stringify(c));
    copy.id = window.uid();
    copy.name = c.name + ' (copia)';
    if (opOverride !== undefined) copy.operator = opOverride;
    setCables([...cables, copy]);
    setSelectedId(copy.id);
    toast('Cable duplicado');
  });
  const newCable = ifUnlocked((operator = '') => {
    setEditorCable({
      _isNew: true, id: 'new', name: 'Nuevo cable',
      operator, type: '', notes: '', photos: [],
      tubes: [
        { colorId: 'blanco', fibers: ['rojo','azul','verde','amarillo'] },
        { colorId: 'rojo',   fibers: ['rojo','azul','verde','amarillo'] },
        { colorId: 'azul',   fibers: ['rojo','azul','verde','amarillo'] },
        { colorId: 'verde',  fibers: ['rojo','azul','verde','amarillo'] },
      ],
    });
  });
  const factoryReset = ifUnlocked(async () => {
    if (!confirm('Recargar datos de fábrica desde "assets/factory-backup.json"?\n\nSe sobreescribirán cables, referencia y galería.')) return;
    const data = await window.refreshFromFactory();
    if (data) {
      if (Array.isArray(data.cables)) setCables(data.cables);
      toast('Datos de fábrica recargados');
    } else {
      // Fallback to in-app defaults
      window.resetCables();
      const fresh = JSON.parse(JSON.stringify(window.DEFAULT_CABLES));
      setCables(fresh);
      setSelectedId(fresh[0].id);
      toast('Cables restaurados (defaults)');
    }
  });

  // Operator-level actions
  const renameOperator = ifUnlocked((oldOp) => {
    const isNo = oldOp === window.NO_OPERATOR;
    const newOp = prompt(`Renombrar "${oldOp}" a:`, isNo ? '' : oldOp);
    if (newOp === null) return;
    setCables(cs => cs.map(c => {
      const cop = (c.operator || '').trim() || window.NO_OPERATOR;
      if (cop !== oldOp) return c;
      return { ...c, operator: newOp.trim() };
    }));
    toast('Operadora renombrada');
  });
  const deleteOperator = ifUnlocked((op) => {
    const count = cables.filter(c => ((c.operator || '').trim() || window.NO_OPERATOR) === op).length;
    if (!confirm(`¿Eliminar la operadora "${op}"? Los ${count} cable(s) se moverán a "Sin operadora".`)) return;
    setCables(cs => cs.map(c => {
      const cop = (c.operator || '').trim() || window.NO_OPERATOR;
      return cop === op ? { ...c, operator: '' } : c;
    }));
    toast('Operadora eliminada');
  });
  const newOperator = ifUnlocked(() => {
    const name = prompt('Nombre de la nueva operadora:');
    if (!name || !name.trim()) return;
    const op = name.trim();
    setCollapsedOps(s => ({ ...s, [op]: false }));
    if (confirm(`Crear cable de ejemplo en "${op}"?`)) newCable(op);
    else toast(`Operadora "${op}" lista (añade un cable)`);
  });

  // Inline quick-edit of a tube/fiber color from the main view
  // Quick-pick from main view: passes optional label flag + current label
  const quickPick = (title, value, onApply, opts = {}) => {
    if (locked) { toast('Desbloquea el candado para editar colores'); return; }
    setPicker({ title, value, askLabel: !!opts.askLabel, label: opts.label || '',
      onSave: (v, lbl) => { onApply(v, lbl); setPicker(null); toast('Color actualizado'); } });
  };

  // Backup/restore controls
  const fileJsonRef = useRef(null);
  const fileXlsxRef = useRef(null);
  const fileZipRef  = useRef(null);

  return (
    <div className="app">
      {/* ----- Sidebar ----- */}
      <aside className="side">
        <div className="brand">
          <div className="brand-mark">F</div>
          <div>
            <div className="brand-name">Código Fibras</div>
            <div className="brand-sub">{(window.APP_EDITION || 'Pro')} · v{window.APP_VERSION || '5.1'}</div>
          </div>
          <div style={{flex:1}} />
          <span className="aruiz-badge">A.Ruiz</span>
          <button className="btn btn-icon btn-ghost theme-toggle" onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}
                  aria-label="Cambiar tema" title="Cambiar tema">
            <span className="theme-icon-swap" key={theme}>{theme === 'light' ? <IconMoon /> : <IconSun />}</span>
          </button>
        </div>

        <div className="nav-section">
          <button className={`nav-btn ${view === 'cables' ? 'active' : ''}`} onClick={() => setView('cables')}>
            <span className="ico"><IconCable /></span> Cables
          </button>
          <button className={`nav-btn ${view === 'reference' ? 'active' : ''}`} onClick={() => setView('reference')}>
            <span className="ico"><IconBook /></span> Referencia
          </button>
          <button className={`nav-btn ${view === 'gallery' ? 'active' : ''}`} onClick={() => setView('gallery')}>
            <span className="ico"><IconGrid /></span> Galería CTOs
          </button>
          <button className={`nav-btn ${view === 'help' ? 'active' : ''}`} onClick={() => setView('help')}>
            <span className="ico"><IconInfo /></span> Ayuda / Guía
          </button>
        </div>

        {view === 'cables' && (
        <div className="side-section side-cable-list-wrap" style={{ flex: 1, overflow: 'auto' }}>
          <div style={{marginBottom: 10}}>
            <input className="input" placeholder="Buscar cable u operadora…"
                   value={sidebarSearch}
                   onChange={(e) => setSidebarSearch(e.target.value)}
                   style={{fontSize: 13, padding: '8px 12px'}} />
          </div>
          <h4 style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap: 8}}>
            <span>Operadoras · {grouped.length}</span>
            <span style={{display:'flex', gap: 4}}>
              <button className="btn btn-sm" onClick={newOperator} style={{padding:'4px 8px'}} title="Nueva operadora" disabled={locked}>
                <IconPlus />
              </button>
              <button className="btn btn-sm btn-primary" onClick={() => newCable()} style={{padding:'4px 8px'}} disabled={locked}>
                <IconPlus /> Cable
              </button>
            </span>
          </h4>
          {grouped.map(([op, list]) => (
            <OperatorGroup
              key={op}
              op={op}
              cables={list}
              selectedId={selectedId}
              collapsed={!!collapsedOps[op]}
              onToggle={() => setCollapsedOps(s => ({ ...s, [op]: !s[op] }))}
              onSelect={(id) => { setSelectedId(id); setSearch(''); setHighlight(null); setTab('cable'); setView('cables'); setTimeout(() => { const m = document.querySelector('.main'); if (m) m.scrollTop = 0; window.scrollTo(0, 0); }, 0); }}
              onMenu={(op, btn) => {
                if (locked) { toast('Desbloquea el candado'); return; }
                const r = btn.getBoundingClientRect();
                setOpMenu({ op, x: r.left, y: r.bottom + 4 });
              }}
            />
          ))}
          {grouped.length === 0 && (
            <div style={{textAlign: 'center', padding: 20, color: 'var(--ink-3)', fontSize: 13}}>
              Sin resultados
            </div>
          )}
        </div>
        )}

        <div className="side-actions">
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap: 8}}>
            <button className="btn" onClick={() => { window.downloadBackup(cables); toast('Backup descargado'); }}>
              <IconDownload /> Backup
            </button>
            <button className="btn" onClick={() => fileJsonRef.current.click()}>
              <IconUpload /> Restaurar
            </button>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap: 8}}>
            <button className="btn btn-primary" onClick={async () => {
              try { await window.downloadCompleteBackup(cables); toast('ZIP completo descargado'); }
              catch (err) { alert('Error: ' + err.message); }
            }}>
              <IconDownload /> Backup ZIP
            </button>
            <button className="btn" onClick={() => fileZipRef.current.click()}>
              <IconUpload /> Restaurar ZIP
            </button>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap: 8}}>
            <button className="btn btn-sm" onClick={async () => {
              try { await window.exportCablesToExcel(cables); toast('Excel descargado'); }
              catch (err) { alert('Error: ' + err.message); }
            }}>
              <IconDownload /> Excel
            </button>
            <button className="btn btn-sm" onClick={() => fileXlsxRef.current.click()}>
              <IconUpload /> Excel
            </button>
          </div>
          <button className="btn btn-ghost btn-sm" style={{fontSize: 11}}
                  onClick={async () => {
                    try { await window.downloadExcelTemplate(); toast('Plantilla descargada'); }
                    catch (err) { alert('Error: ' + err.message); }
                  }}>↓ Plantilla Excel</button>
          <button className="btn btn-ghost btn-sm" onClick={factoryReset}>Recargar fábrica</button>
          {canInstall && (
            <button className="btn btn-primary btn-sm" onClick={installApp}
                    style={{background: 'var(--accent)', borderColor: 'var(--accent)', color: 'white'}}>
              📲 Instalar app
            </button>
          )}
          <button className="btn btn-ghost btn-sm" onClick={() => setShowWelcome(true)}>
            Ver aviso de datos
          </button>
          <a className="subtle" href="index.html?choose=1">← cambiar diseño</a>
        </div>

        <input ref={fileJsonRef} type="file" accept="application/json" style={{display:'none'}}
               onChange={async (e) => {
                 const f = e.target.files[0]; if (!f) return;
                 try {
                   const list = await window.restoreBackup(f);
                   if (confirm(`Restaurar ${list.length} cable(s)? Se reemplazarán los actuales.`)) {
                     setCables(list); toast('Backup restaurado');
                   }
                 } catch (err) { alert('Error: ' + err.message); }
                 e.target.value = '';
               }} />
        <input ref={fileXlsxRef} type="file" accept=".xlsx,.xls" style={{display:'none'}}
               onChange={async (e) => {
                 const f = e.target.files[0]; if (!f) return;
                 try {
                   const imported = await window.importCablesFromExcel(f);
                   const mode = confirm(`Importar ${imported.length} cable(s)?\n\nOK = añadir a los existentes\nCancelar = reemplazar todos`);
                   setCables(mode ? [...cables, ...imported] : imported);
                   toast(`${imported.length} cable(s) importado(s)`);
                 } catch (err) { alert('Error: ' + err.message); }
                 e.target.value = '';
               }} />
        <input ref={fileZipRef} type="file" accept=".zip" style={{display:'none'}}
               onChange={async (e) => {
                 const f = e.target.files[0]; if (!f) return;
                 try {
                   const list = await window.restoreCompleteBackup(f);
                   if (confirm(`Restaurar ${list.length} cable(s) y todas las fotos? Se reemplazarán los actuales.`)) {
                     setCables(list); toast('Backup completo restaurado');
                   }
                 } catch (err) { alert('Error: ' + err.message); }
                 e.target.value = '';
               }} />
      </aside>

      {/* ----- Main ----- */}
      <main className="main">
        <div className="topbar">

          <button
            className={`lock-pill ${locked ? '' : 'unlocked'}`}
            onClick={() => { setLocked(!locked); toast(locked ? '🔓 Desbloqueado' : '🔒 Bloqueado'); }}
            title={locked ? 'Pulsa para desbloquear' : 'Pulsa para bloquear'}>
            {locked ? <IconLock /> : <IconUnlock />}
            {locked ? 'Bloqueado' : 'Desbloqueado'}
          </button>

          <div className="topbar-title">
            {view === 'reference' ? 'Referencia técnica' :
             view === 'gallery'   ? 'Galería CTOs' :
             view === 'help'      ? 'Guía rápida' :
             (selected ? selected.name : 'Sin cable')}
          </div>
          {view === 'cables' && (
            <div className="search-box">
              <IconSearch />
              <input type="number" inputMode="numeric" placeholder="Nº fibra…"
                     value={search} onChange={(e) => setSearch(e.target.value)} />
            </div>
          )}
          {view === 'cables' && selected && (
            <div className="topbar-actions">
              <button className="btn btn-icon" title="Editar" onClick={() => setEditorCable(selected)} disabled={locked}><IconEdit /></button>
              <button className="btn btn-icon" title="Mover" onClick={() => setMovingCable(selected)} disabled={locked}><IconMove /></button>
              <button className="btn btn-icon" title="Duplicar" onClick={() => duplicateCable(selected.id)} disabled={locked}><IconCopy /></button>
              <button className="btn btn-icon btn-danger" title="Borrar" onClick={() => deleteCable(selected.id)} disabled={locked}><IconTrash /></button>
            </div>
          )}
        </div>

        {/* Render area */}
        {view === 'reference' ? (
          <ReferenceView locked={locked} toast={toast} />
        ) : view === 'gallery' ? (
          <GalleryView locked={locked} toast={toast} />
        ) : view === 'help' ? (
          <HelpView />
        ) : (
        <>
        {/* Mobile cable picker: operator dropdown + cables of selected operator */}
        <MobilePicker cables={cables}
                      selectedId={selectedId}
                      onSelect={(id) => { setSelectedId(id); setSearch(''); setHighlight(null); setTab('cable'); setTimeout(() => { const m = document.querySelector('.main'); if (m) m.scrollTop = 0; window.scrollTo(0, 0); }, 0); }} />

        {/* Tabs */}
        {selected && (
          <div className="tabs">
            <button className={`tab ${tab === 'cable' ? 'active' : ''}`} onClick={() => setTab('cable')}>
              <IconCable /> Cable
            </button>
            <button className={`tab ${tab === 'info' ? 'active' : ''}`} onClick={() => setTab('info')}>
              <IconInfo /> Información
              {((selected.photos?.length || 0) + (selected.notes ? 1 : 0)) > 0 &&
                <span className="badge">{(selected.photos?.length || 0)}{selected.notes ? '·' : ''}{selected.notes ? '📝' : ''}</span>
              }
            </button>
          </div>
        )}

        {lookup && selected && tab === 'cable' && (
          <div className="lookup-result">
            <div className="lookup-num mono">{parseInt(search)}</div>
            <div className="lookup-info">
              <div className="lookup-info-row">
                <span>Tubo</span>
                <span className="color-pill">
                  <Swatch color={lookup.tubeColor} size={14} />
                  <b>T{lookup.tubeIdx + 1} · {lookup.tubeLabel}</b>
                  {lookup.tubeNote && <span style={{marginLeft:6, fontSize:11, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'.06em'}}>{lookup.tubeNote}</span>}
                </span>
                <IconChevR />
                <span>Fibra</span>
                <span className="color-pill">
                  <Swatch color={lookup.fiberColor} size={14} />
                  <b>{lookup.fiberIdx + 1} · {lookup.fiberLabel}</b>
                </span>
              </div>
              <div className="lookup-info-row">
                <span className="mono">Tubo T{lookup.tubeIdx + 1} · Fibras {selected.tubes.slice(0, lookup.tubeIdx).reduce((s, t) => s + t.fibers.length, 0) + 1}–{selected.tubes.slice(0, lookup.tubeIdx + 1).reduce((s, t) => s + t.fibers.length, 0)} · {selected.name}</span>
              </div>
            </div>
            <button className="btn btn-icon btn-ghost" onClick={() => { setSearch(''); setHighlight(null); }}><IconClose /></button>
          </div>
        )}

        {!selected ? (
          <div className="empty">
            <h2>No hay cables</h2>
            <p>Crea uno nuevo o restaura los cables de fábrica</p>
            <button className="btn btn-primary" onClick={() => newCable()}><IconPlus /> Nuevo cable</button>
          </div>
        ) : tab === 'info' ? (
          <InfoTab cable={selected} onUpdate={updateSelectedAlways} toast={toast} locked={locked} />
        ) : (
          <div className="canvas">
            <div className="cable-header">
              <div>
                <h1>{selected.name}</h1>
                <div className="cable-stats">
                  <span><b>{selected.tubes.length}</b> tubos</span>
                  <span><b>{selected.tubes[0]?.fibers.length || 0}</b> fibras/tubo</span>
                  <span><b>{window.totalFibers(selected)}</b> total</span>
                  {selected.operator && <span>· {selected.operator}</span>}
                  {selected.type && <span>· {selected.type}</span>}
                </div>
              </div>
            </div>

            {/* Always-visible sequence editors */}
            <div className="seq-card">
              <div className="seq-card-head">
                <h3>Secuencia de tubos</h3>
                <span className="hint">Pulsa un chip para editarlo</span>
              </div>
              <SequenceChips
                items={selected.tubes}
                getColor={(t) => t.colorId}
                baseLabel="T"
                getSubtle={(i) => {
                  const base = selected.tubes.slice(0, i).reduce((s, t) => s + t.fibers.length, 0);
                  return `${base + 1}–${base + selected.tubes[i].fibers.length}`;
                }}
                onEdit={(i) => quickPick(
                  `Tubo ${i + 1}`,
                  selected.tubes[i].colorId,
                  (v, lbl) => updateSelected({
                    tubes: selected.tubes.map((t, ti) => ti === i ? { ...t, colorId: v, ...(lbl !== undefined ? { label: lbl } : {}) } : t)
                  }),
                  { askLabel: true, label: selected.tubes[i].label || '' }
                )}
              />
            </div>

            <div className="seq-card">
              <div className="seq-card-head">
                <h3>Secuencia de fibras</h3>
                <span className="hint">Aplica a todos los tubos</span>
              </div>
              <SequenceChips
                items={selected.tubes[0]?.fibers || []}
                getColor={(v) => v}
                baseLabel="F"
                onEdit={(i) => quickPick(
                  `Fibra posición ${i + 1}`,
                  selected.tubes[0].fibers[i],
                  (v) => updateSelected({
                    tubes: selected.tubes.map(t => {
                      const fibers = [...t.fibers];
                      if (i < fibers.length) fibers[i] = v;
                      return { ...t, fibers };
                    })
                  })
                )}
              />
            </div>

            {selected.tubes.map((t, ti) => {
              const base = selected.tubes.slice(0, ti).reduce((s, x) => s + x.fibers.length, 0);
              return (
                <TubeCard key={ti} tube={t} tubeIdx={ti} baseNumber={base}
                          highlight={highlight}
                          onClickHead={(i) => quickPick(
                            `Tubo ${i + 1}`,
                            selected.tubes[i].colorId,
                            (v, lbl) => updateSelected({
                              tubes: selected.tubes.map((t, idx) => idx === i ? { ...t, colorId: v, ...(lbl !== undefined ? { label: lbl } : {}) } : t)
                            }),
                            { askLabel: true, label: selected.tubes[i].label || '' }
                          )}
                          onClickFiber={(i, fi) => quickPick(
                            `Fibra ${base + fi + 1}`,
                            selected.tubes[i].fibers[fi],
                            (v) => updateSelected({
                              tubes: selected.tubes.map((tu, idx) => {
                                if (idx !== i) return tu;
                                const fibers = [...tu.fibers];
                                fibers[fi] = v;
                                return { ...tu, fibers };
                              })
                            })
                          )} />
              );
            })}
            <div style={{ height: 40 }} />
          </div>
        )}
        </>
        )}
      </main>

      {/* Modals */}
      {editorCable && (
        <CableEditor cable={editorCable} allOperators={allOperators}
                     onCancel={() => setEditorCable(null)}
                     onSave={saveCable} />
      )}
      {picker && (
        <ColorPickerModal title={picker.title} value={picker.value}
                          askLabel={picker.askLabel} label={picker.label}
                          onCancel={() => setPicker(null)}
                          onSave={picker.onSave} />
      )}
      {movingCable && (
        <MoveCableDialog cable={movingCable} allOperators={allOperators}
                         onCancel={() => setMovingCable(null)}
                         onMove={(op) => {
                           updateCable(movingCable.id, { operator: op });
                           setMovingCable(null);
                           toast('Cable movido');
                         }} />
      )}
      {showWelcome && <WelcomeModal onClose={() => setShowWelcome(false)} />}

      {/* Operator context menu */}
      {opMenu && (
        <div className="menu" style={{ left: Math.min(opMenu.x, window.innerWidth - 200), top: opMenu.y }}
             onClick={(e) => e.stopPropagation()}>
          <button onClick={() => { newCable(opMenu.op === window.NO_OPERATOR ? '' : opMenu.op); setOpMenu(null); }}>
            <IconPlus /> Añadir cable aquí
          </button>
          <button onClick={() => { renameOperator(opMenu.op); setOpMenu(null); }}>
            <IconEdit /> Renombrar operadora
          </button>
          <hr />
          <button className="danger" onClick={() => { deleteOperator(opMenu.op); setOpMenu(null); }}>
            <IconTrash /> Eliminar operadora
          </button>
        </div>
      )}

      {toastView}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
